<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ACTIVE IPTV ADMIN PANEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
}

/* HEADER */
header{
background:#11182a;
padding:15px;
display:flex;
justify-content:space-between;
}

/* LAYOUT */
.container{
display:flex;
height:100vh;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#11182a;
padding:15px;
overflow-y:auto;
}

.sidebar h2{
color:#00bfff;
}

input, select, button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:5px;
}

button{
background:#00bfff;
color:white;
cursor:pointer;
}

button:hover{
background:#0090cc;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* PLAYER */
.player{
height:300px;
background:black;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
background:black;
}

/* TABLE */
.table-area{
flex:1;
overflow-y:auto;
padding:10px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #2b3a5a;
}

tr:hover{
background:#1b2438;
cursor:pointer;
}

/* ACTIVE */
.active{
background:#00bfff33 !important;
}

.searchbar{
width:100%;
padding:10px;
margin-bottom:10px;
}

</style>
</head>

<body>

<header>
<h2>📺 ACTIVE IPTV ADMIN PANEL</h2>
<span id="total">0 Channels</span>
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h2>Add Channel</h2>

<input id="name" placeholder="Channel Name">
<input id="url" placeholder="Stream URL (M3U8)">
<select id="category">
<option>Sports</option>
<option>Movies</option>
<option>Kids</option>
<option>News</option>
<option>Music</option>
</select>

<button onclick="addChannel()">➕ Add Channel</button>

</div>

<!-- MAIN -->
<div class="main">

<!-- PLAYER -->
<div class="player">
<video id="videoPlayer" controls autoplay></video>
</div>

<!-- SEARCH -->
<div style="padding:10px;">
<input class="searchbar" id="search" onkeyup="render()" placeholder="Search channels...">
</div>

<!-- TABLE -->
<div class="table-area">
<table>
<thead>
<tr>
<th>Name</th>
<th>Category</th>
<th>URL</th>
<th>Action</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

</div>
</div>

<script>

let channels = JSON.parse(localStorage.getItem("channels")) || [];

/* DEFAULT DEMO CHANNELS */
if(channels.length === 0){
channels = [
{name:"BBC News HD", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", category:"News"},
{name:"Sports Live", url:"https://test-streams.mux.dev/test_001/stream.m3u8", category:"Sports"},
{name:"Movie HD", url:"https://test-streams.mux.dev/test_002/stream.m3u8", category:"Movies"},
];
save();
}

/* PLAY CHANNEL */
function play(url, row){
let video = document.getElementById("videoPlayer");
video.src = url;
video.play();

/* highlight active */
document.querySelectorAll("tr").forEach(r => r.classList.remove("active"));
if(row) row.classList.add("active");
}

/* ADD */
function addChannel(){
let name = document.getElementById("name").value;
let url = document.getElementById("url").value;
let category = document.getElementById("category").value;

if(!name || !url) return alert("Fill all fields");

channels.push({name,url,category});
save();
render();

document.getElementById("name").value="";
document.getElementById("url").value="";
}

/* SAVE */
function save(){
localStorage.setItem("channels", JSON.stringify(channels));
}

/* RENDER */
function render(){

let tbody = document.getElementById("list");
let search = document.getElementById("search").value.toLowerCase();

tbody.innerHTML = "";

let filtered = channels.filter(c =>
c.name.toLowerCase().includes(search)
);

filtered.forEach((c,i)=>{

let row = document.createElement("tr");

row.innerHTML = `
<td>${c.name}</td>
<td>${c.category}</td>
<td style="max-width:200px;overflow:hidden;">${c.url}</td>
<td><button>▶ Play</button></td>
`;

row.onclick = () => play(c.url, row);

tbody.appendChild(row);
});

document.getElementById("total").innerText = filtered.length + " Channels";
}

render();

</script>

</body>
</html>
