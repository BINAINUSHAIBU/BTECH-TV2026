<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPTV PRO 40K DASHBOARD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
display:flex;
height:100vh;
}

/* SIDEBAR */
.sidebar{
width:280px;
background:#11182a;
padding:10px;
overflow-y:auto;
}

.channel{
padding:8px;
margin:5px 0;
background:#1b2438;
cursor:pointer;
border-radius:5px;
font-size:13px;
display:flex;
justify-content:space-between;
}

.channel:hover{
background:#2b3a5a;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

.topbar{
padding:10px;
background:#11182a;
display:flex;
justify-content:space-between;
align-items:center;
}

input{
padding:8px;
width:300px;
border-radius:6px;
border:none;
}

/* PLAYER */
.player{
flex:1;
background:black;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
}

/* STATS */
.stats{
display:flex;
gap:10px;
padding:10px;
background:#0f172a;
}

.card{
flex:1;
background:#1b2438;
padding:10px;
border-radius:8px;
text-align:center;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h3>📺 IPTV CHANNELS</h3>
<div id="channelList"></div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div><b>IPTV PRO 40K SYSTEM</b></div>

<input placeholder="Search channels..."
oninput="searchChannels(this.value)">
</div>

<!-- STATS -->
<div class="stats">

<div class="card">
<h3>Total</h3>
<p id="total">0</p>
</div>

<div class="card">
<h3>Status</h3>
<p id="status">LOADING...</p>
</div>

<div class="card">
<h3>Sources</h3>
<p id="sources">0</p>
</div>

</div>

<!-- PLAYER -->
<div class="player">
<video id="videoPlayer" controls autoplay></video>
</div>

</div>

<script>

/* =========================
40K CHANNEL GENERATOR
========================= */
let allChannels=[];

/* =========================
REAL IPTV SOURCES
========================= */
const feeds=[

{name:'IPTV-ORG',url:'https://iptv-org.github.io/iptv/index.m3u'},

{name:'Free-TV',url:'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8'},

{name:'Sports',url:'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_sports.m3u8'},

{name:'Movies',url:'https://www.apsattv.com/movies.m3u'},

{name:'News',url:'https://www.apsattv.com/news.m3u'},

{name:'Africa',url:'https://www.apsattv.com/africa.m3u'},

{name:'USA',url:'https://www.apsattv.com/usa.m3u'},

{name:'TVPASS',url:'https://tvpass.org/playlist/m3u'}

];

/* =========================
CORS PROXY
========================= */
const proxy="https://api.allorigins.win/raw?url=";

/* =========================
LOAD ALL CHANNELS
========================= */
async function loadFeeds(){

let seen={};

for(let f of feeds){

try{

let txt=await fetch(proxy+encodeURIComponent(f.url))
.then(r=>r.text());

parseM3U(txt,seen);

}catch(e){}

}

document.getElementById("sources").innerText=feeds.length;

document.getElementById("status").innerText="ONLINE";

document.getElementById("total").innerText=allChannels.length;

render(allChannels);

}

/* =========================
PARSE M3U
========================= */
function parseM3U(data,seen){

let lines=data.split("\n");

let temp={};

for(let line of lines){

if(line.startsWith("#EXTINF")){

temp.name=line.split(",")[1]||"Unknown";

}

else if(line.startsWith("http")){

temp.url=line;

if(!seen[temp.url]){

allChannels.push(temp);

seen[temp.url]=1;

}

temp={};

}

}

}

/* =========================
RENDER CHANNELS
========================= */
function render(list){

let box=document.getElementById("channelList");

box.innerHTML="";

list.slice(0,500).forEach(ch=>{

let div=document.createElement("div");

div.className="channel";

div.innerHTML=
`<span>${ch.name}</span><span>● LIVE</span>`;

div.onclick=()=>{

videoPlayer.src=ch.url;

videoPlayer.play();

};

box.appendChild(div);

});

}

/* =========================
SEARCH
========================= */
function searchChannels(q){

let res=allChannels.filter(c=>
c.name.toLowerCase()
.includes(q.toLowerCase())
);

render(res);

}

/* =========================
INIT
========================= */
loadFeeds();

</script>

</body>
</html>
