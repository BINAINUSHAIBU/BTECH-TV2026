
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HD IPTV PRO 40K SYSTEM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
background:#11182a;
padding:10px 15px;
position:sticky;
top:0;
z-index:100;
}

.menu a{
color:white;
margin:0 8px;
text-decoration:none;
font-size:14px;
cursor:pointer;
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 50px);
}

/* SIDEBAR */
.sidebar{
width:280px;
background:#11182a;
padding:10px;
overflow-y:auto;
}

.sidebar h3{
color:#00bfff;
margin:5px 0;
}

.channel{
padding:8px;
margin:5px 0;
background:#1b2438;
cursor:pointer;
border-radius:5px;
font-size:13px;
display:flex;
justify-content:space-between;
}

.channel:hover{
background:#2b3a5a;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

.search{
padding:10px;
background:#11182a;
}

input{
width:100%;
padding:10px;
border:none;
border-radius:5px;
outline:none;
}

/* PLAYER */
.player{
flex:1;
background:black;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
}

/* SETTINGS PANEL */
.settings{
position:fixed;
right:10px;
top:60px;
width:250px;
background:#1b2438;
padding:10px;
border-radius:8px;
display:none;
}

.settings h4{
color:#00bfff;
}

.settings label{
display:block;
margin:8px 0 4px;
font-size:12px;
}

.settings select, .settings input{
width:100%;
padding:6px;
border:none;
border-radius:5px;
}
</style>
</head>

<body>

<div class="topbar">
<div><b>📺 IPTV PRO 40K SYSTEM</b></div>

<div class="menu">
<a onclick="toggleSettings()">Settings</a>
<a onclick="loadCategory('ALL')">All</a>
<a onclick="loadCategory('SPORTS')">Sports</a>
<a onclick="loadCategory('MOVIES')">Movies</a>
<a onclick="loadCategory('KIDS')">Kids</a>
<a onclick="loadCategory('NEWS')">News</a>
</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>CHANNELS</h3>
<div id="channelList"></div>
</div>

<!-- MAIN -->
<div class="main">

<div class="search">
<input type="text" placeholder="Search 40,000 channels..." oninput="searchChannels(this.value)">
</div>

<div class="player">
<video id="videoPlayer" controls autoplay></video>
</div>

</div>

</div>

<!-- SETTINGS -->
<div class="settings" id="settingsBox">
<h4>Settings</h4>

<label>Theme</label>
<select onchange="setTheme(this.value)">
<option value="dark">Dark</option>
<option value="blue">Blue</option>
</select>

<label>Auto Play</label>
<select onchange="autoPlay=this.value==='true'">
<option value="true">ON</option>
<option value="false">OFF</option>
</select>

<label>Quality Mode</label>
<select>
<option>Auto</option>
<option>1080p</option>
<option>720p</option>
<option>480p</option>
</select>
</div>

<script>

let channels = [];
let autoPlay = true;

/* GENERATE 40,000 CHANNELS */
function generateChannels(){
const cats = ["SPORTS","MOVIES","KIDS","NEWS","MUSIC","DOCUMENTARY"];

for(let i=1;i<=40000;i++){
let cat = cats[i % cats.length];

channels.push({
id:i,
name: cat + " CHANNEL " + i,
category:cat,
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
  

});
}
}
generateChannels();

/* LOAD CHANNELS (LIMITED RENDER FOR SPEED) */
function loadCategory(cat){
let list = document.getElementById("channelList");
list.innerHTML="";

let filtered = channels.filter(c => cat==="ALL" || c.category===cat);

renderList(filtered.slice(0,200)); // lazy load 200 at a time
}

function renderList(data){
let list = document.getElementById("channelList");

data.forEach(ch=>{
let div = document.createElement("div");
div.className="channel";
div.innerHTML = `<span>${ch.name}</span><span>● LIVE</span>`;
div.onclick=()=>play(ch.url);
list.appendChild(div);
});
}

/* SEARCH */
function searchChannels(q){
let list = document.getElementById("channelList");
list.innerHTML="";

let res = channels.filter(c =>
c.name.toLowerCase().includes(q.toLowerCase())
).slice(0,200);

renderList(res);
}

/* PLAY */
function play(url){
let video = document.getElementById("videoPlayer");
video.src = url;
video.play();
}

/* SETTINGS */
function toggleSettings(){
let box = document.getElementById("settingsBox");
box.style.display = box.style.display==="block"?"none":"block";
}

function setTheme(t){
if(t==="blue"){
document.body.style.background="#061a33";
}else{
document.body.style.background="#0b0f1a";
}
}

/* INIT */
loadCategory("ALL");

</script>


<script>

let allChannels=[];
let favorites=[];
let recent=[];
let autoPlay=true;

/* --------------------------
PLAYLIST SOURCES (40K+)
-------------------------- */

const feeds=[

{name:'Free-TV',
url:'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8'},

{name:'IPTV ORG',
url:'https://iptv-org.github.io/iptv/index.m3u'},

{ name:'Sports',
url:'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_sports.m3u8'
},

{name:'Movies',
url:'https://www.apsattv.com/movies.m3u'},

{name:'Kids',
url:'https://www.apsattv.com/kids.m3u'},

{name:'News',
url:'https://www.apsattv.com/news.m3u'},

{name:'Nigeria',
url:'https://www.apsattv.com/nigeria.m3u'},

{name:'Africa',
url:'https://www.apsattv.com/africa.m3u'},

{name:'USA',
url:'https://www.apsattv.com/usa.m3u'}

];


/* --------------------
LOAD PLAYLISTS
-------------------- */

async function loadFeeds(){

for(let f of feeds){

try{

let txt=await fetch(
'https://api.allorigins.win/raw?url='+
encodeURIComponent(f.url)
).then(r=>r.text());

parseM3U(txt);

}catch(e){

console.log("FAILED",f.name)

}

}

render(allChannels);

document.getElementById(
'total'
).innerHTML=allChannels.length;

}

loadFeeds();


/* -------------------
PARSE M3U
------------------- */

function parseM3U(data){

let lines=data.split('\n');

let current={};

for(let line of lines){

if(line.startsWith("#EXTINF")){

let name=line.split(',');

current.name=name[1]||"Unknown";

}

else if(line.startsWith("http")){

current.url=line;

allChannels.push(current);

current={};

}

}

}


/* -----------------
RENDER
----------------- */

function render(channels){

let list=document.getElementById(
'channelList'
);

list.innerHTML='';

channels.slice(0,500).forEach(ch=>{

let div=document.createElement('div');

div.className='channel';

div.innerHTML=`

<span>${ch.name}</span>

<span style="color:lime">
● LIVE
</span>

`;

div.onclick=()=>play(ch);

list.appendChild(div);

});

}


/* -----------------
PLAY CHANNEL
----------------- */

function play(ch){

let video=
document.getElementById(
'videoPlayer'
);

video.src=ch.url;

if(autoPlay)
video.play();

recent.unshift(ch);

localStorage.setItem(
'recent',
JSON.stringify(recent)
);

}


/* -----------------
SEARCH
----------------- */

function searchChannels(q){

let result=
allChannels.filter(x=>

x.name.toLowerCase()

.includes(q.toLowerCase())

);

render(result);

}


/* -----------------
FAVORITES
----------------- */

function addFavorite(ch){

favorites.push(ch);

localStorage.setItem(
'favorites',
JSON.stringify(favorites)
);

}


/* -----------------
THEME
----------------- */

function setTheme(v){

if(v=="blue")
document.body.style.background=
"#00152d";

else
document.body.style.background=
"#0b0f1a";

}


/* -----------------
QUALITY
----------------- */

function setQuality(q){

console.log("QUALITY",q);

}


/* -----------------
STATUS
----------------- */

setInterval(()=>{

document.getElementById(
'status'
).innerHTML=

"ONLINE • "+allChannels.length+
" Channels";

},3000);

</script>


</body>
</html>
