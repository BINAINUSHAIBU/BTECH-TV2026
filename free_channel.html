<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>BTECH TV - Free Channels Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:#fff;
overflow-x:hidden;
}

/* DASHBOARD */

.dashboard-container{
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:#111827;
padding:20px;
overflow-y:auto;
}

.sidebar h2{
text-align:center;
color:#16a34a;
margin-bottom:30px;
}

.sidebar ul{
list-style:none;
}

.sidebar ul li{
margin-bottom:12px;
}

.sidebar ul li a{
display:block;
padding:14px;
border-radius:10px;
background:#1e293b;
text-decoration:none;
color:white;
transition:0.3s;
}

.sidebar ul li a:hover,
.sidebar ul li.active a{
background:#16a34a;
color:white;
}

/* MAIN */

.dashboard-main{
flex:1;
padding:25px;
}

/* HEADER */

.dashboard-header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
margin-bottom:25px;
}

.dashboard-header h1{
font-size:30px;
color:#16a34a;
}

.dashboard-header p{
color:#cbd5e1;
}

/* SEARCH */

.search-box{
width:100%;
margin-bottom:25px;
}

.search-box input{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
font-size:16px;
outline:none;
}

/* STATS */

.stats-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.stat-card{
background:#1e293b;
padding:25px;
border-radius:15px;
transition:0.3s;
}

.stat-card:hover{
transform:translateY(-4px);
}

.stat-card h3{
margin-bottom:10px;
color:#cbd5e1;
}

.stat-card p{
font-size:28px;
font-weight:bold;
color:#16a34a;
}

/* FILTERS */

.filter-controls{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:25px;
}

.filter-btn{
padding:12px 18px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

.filter-btn:hover,
.filter-btn.active{
background:#16a34a;
color:white;
}

/* CHANNEL GRID */

.channel-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

/* CHANNEL CARD */

.channel-card{
background:#1e293b;
border-radius:15px;
overflow:hidden;
transition:0.3s;
}

.channel-card:hover{
transform:translateY(-5px);
}

/* CHANNEL IMAGE */

.channel-banner{
height:160px;
background:#334155;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
color:#16a34a;
position:relative;
background-size:cover;
background-position:center;
}

.channel-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.55);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
font-weight:bold;
}

/* CHANNEL INFO */

.channel-info{
padding:15px;
}

.channel-info h3{
margin-bottom:10px;
font-size:18px;
}

.channel-info p{
margin-bottom:8px;
color:#cbd5e1;
}

/* BADGES */

.badge{
display:inline-block;
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
margin-right:5px;
margin-top:6px;
}

.free{
background:#16a34a;
color:white;
}

.unlocked{
background:#2563eb;
color:white;
}

/* BUTTON */

.watch-btn{
width:100%;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
background:#16a34a;
color:white;
font-weight:bold;
margin-top:12px;
transition:0.3s;
}

.watch-btn:hover{
opacity:0.85;
}

/* LOAD MORE */

.load-more{
margin-top:30px;
text-align:center;
}

.load-more button{
padding:14px 25px;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
font-weight:bold;
cursor:pointer;
}

/* PLAYER */

.player-modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:none;
justify-content:center;
align-items:center;
z-index:999;
padding:20px;
}

.player-box{
width:90%;
max-width:1000px;
background:#111827;
padding:20px;
border-radius:15px;
}

.player-box video{
width:100%;
height:500px;
background:black;
border-radius:10px;
}

.close-btn{
background:red;
border:none;
padding:10px 15px;
border-radius:8px;
color:white;
cursor:pointer;
margin-bottom:15px;
}

/* MOBILE */

@media(max-width:768px){

.sidebar{
display:none;
}

.dashboard-main{
padding:15px;
}

.player-box video{
height:250px;
}

}

</style>

</head>

<body>

<div class="dashboard-container">

<!-- SIDEBAR -->

<aside class="sidebar">

<h2>BTECH TV</h2>

<ul>

<li>
<a href="https://btech-tv.netlify.app/user">
Dashboard
</a>
</li>

<li>
<a href="https://btech-tv.netlify.app/index_dashboard">
All Channels
</a>
</li>

<li class="active">
<a href="#">
Free Channels
</a>
</li>

<li>
<a href="https://btech-tv.netlify.app/userpremium_channels.html">
Premium Channels
</a>
</li>

<li>
<a href="#" onclick="filterCategory('Sports',this)">
Sports
</a>
</li>

<li>
<a href="#" onclick="filterCategory('Movies',this)">
Movies
</a>
</li>

<li>
<a href="#" onclick="filterCategory('Kids',this)">
Kids
</a>
</li>

<li>
<a href="#" onclick="filterCategory('News',this)">
News
</a>
</li>

<li>
<a href="#">
Settings
</a>
</li>

</ul>

</aside>

<!-- MAIN -->

<main class="dashboard-main">

<header class="dashboard-header">

<div>

<h1>Free Channels Dashboard</h1>

<p id="liveInfo">
Loading Free IPTV Channels...
</p>

</div>

</header>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search free channels..."
onkeyup="searchChannels()"
>

</div>

<!-- STATS -->

<section class="stats-grid">

<div class="stat-card">

<h3>Total Free Channels</h3>

<p id="freeChannels">
0
</p>

</div>

<div class="stat-card">

<h3>Sports Channels</h3>

<p id="sportsChannels">
0
</p>

</div>

<div class="stat-card">

<h3>Movie Channels</h3>

<p id="movieChannels">
0
</p>

</div>

<div class="stat-card">

<h3>News Channels</h3>

<p id="newsChannels">
0
</p>

</div>

</section>

<!-- FILTER BUTTONS -->

<div class="filter-controls">

<button
class="filter-btn active"
onclick="showAll(this)"
>
All
</button>

<button
class="filter-btn"
onclick="filterCategory('Sports',this)"
>
Sports
</button>

<button
class="filter-btn"
onclick="filterCategory('Movies',this)"
>
Movies
</button>

<button
class="filter-btn"
onclick="filterCategory('News',this)"
>
News
</button>

<button
class="filter-btn"
onclick="filterCategory('Kids',this)"
>
Kids
</button>

</div>

<!-- CHANNEL GRID -->

<section
class="channel-grid"
id="channelGrid"
>

</section>

<!-- LOAD MORE -->

<div class="load-more">

<button onclick="loadMore()">
LOAD MORE CHANNELS
</button>

</div>

</main>

</div>

<!-- PLAYER -->

<div
class="player-modal"
id="playerModal"
>

<div class="player-box">

<button
class="close-btn"
onclick="closePlayer()"
>

Close

</button>

<h2 id="playerTitle"></h2>

<video
id="videoPlayer"
controls
autoplay
></video>

</div>

</div>

<script>

/* ====================================
SETTINGS
==================================== */

const SETTINGS={

showPerPage:120,
totalChannels:12500

};

/* ====================================
FREE CHANNEL DATABASE
==================================== */

const freeChannels=[];

let filteredChannels=[];

let currentPage=0;

let currentHls=null;

const categories=[

"Sports",
"Movies",
"News",
"Kids",
"Music",
"Entertainment"

];

/* ====================================
GENERATE FREE CHANNELS
==================================== */

for(let i=1;i<=SETTINGS.totalChannels;i++){

freeChannels.push({

id:i,

name:`FREE Channel ${i}`,

category:
categories[
Math.floor(
Math.random()*categories.length
)
],

type:"Free",

status:"Unlocked",

live:
Math.random()>0.08,

views:
Math.floor(
Math.random()*500000
),

logo:
`https://via.placeholder.com/300x150/111827/16a34a?text=FREE+${i}`,

streamUrl:
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"

});

}

filteredChannels=[...freeChannels];

/* ====================================
UPDATE STATS
==================================== */

function updateStats(){

document.getElementById(
"freeChannels"
).innerText=
freeChannels.length.toLocaleString();

document.getElementById(
"sportsChannels"
).innerText=
freeChannels.filter(
c=>c.category==="Sports"
).length.toLocaleString();

document.getElementById(
"movieChannels"
).innerText=
freeChannels.filter(
c=>c.category==="Movies"
).length.toLocaleString();

document.getElementById(
"newsChannels"
).innerText=
freeChannels.filter(
c=>c.category==="News"
).length.toLocaleString();

document.getElementById(
"liveInfo"
).innerText=
`${freeChannels.length.toLocaleString()} Free IPTV Channels Loaded`;

}

/* ====================================
RENDER CHANNELS
==================================== */

function renderChannels(list,append=false){

const grid=
document.getElementById(
"channelGrid"
);

if(!append){

grid.innerHTML="";

}

const start=
currentPage*
SETTINGS.showPerPage;

const end=
start+
SETTINGS.showPerPage;

list
.slice(start,end)
.forEach(channel=>{

grid.innerHTML+=`

<div class="channel-card">

<div
class="channel-banner"
style="
background-image:
url('${channel.logo}');
"
>

<div class="channel-overlay">

${channel.live
? "🔴 LIVE"
: "⚫ OFFLINE"}

<br>

${channel.category}

</div>

</div>

<div class="channel-info">

<h3>
${channel.name}
</h3>

<p>
👥 ${channel.views.toLocaleString()} viewers
</p>

<span class="badge free">
Free
</span>

<span class="badge unlocked">
Unlocked
</span>

<button
class="watch-btn"
onclick="
watchChannel(
${channel.id}
)
"
>

▶ Watch Free Channel

</button>

</div>

</div>

`;

});

}

/* ====================================
SEARCH CHANNELS
==================================== */

function searchChannels(){

const value=
document
.getElementById(
"searchInput"
)
.value
.toLowerCase();

filteredChannels=
freeChannels.filter(channel=>

channel.name
.toLowerCase()
.includes(value)

||

channel.category
.toLowerCase()
.includes(value)

);

currentPage=0;

renderChannels(filteredChannels);

}

/* ====================================
FILTER CATEGORY
==================================== */

function filterCategory(category,btn=null){

currentPage=0;

filteredChannels=
freeChannels.filter(
c=>c.category===category
);

setActiveButton(btn);

renderChannels(filteredChannels);

}

/* ====================================
SHOW ALL
==================================== */

function showAll(btn=null){

currentPage=0;

filteredChannels=[...freeChannels];

setActiveButton(btn);

renderChannels(filteredChannels);

}

/* ====================================
ACTIVE BUTTON
==================================== */

function setActiveButton(btn){

if(!btn) return;

const buttons=
document.querySelectorAll(
'.filter-btn'
);

buttons.forEach(button=>{

button.classList.remove(
'active'
);

});

btn.classList.add(
'active'
);

}

/* ====================================
LOAD MORE
==================================== */

function loadMore(){

currentPage++;

renderChannels(
filteredChannels,
true
);

}

/* ====================================
WATCH CHANNEL
==================================== */

function watchChannel(id){

const channel=
freeChannels.find(
c=>c.id===id
);

document
.getElementById(
"playerModal"
)
.style.display=
"flex";

document
.getElementById(
"playerTitle"
)
.innerText=
channel.name;

const video=
document
.getElementById(
"videoPlayer"
);

if(currentHls){

currentHls.destroy();

}

if(Hls.isSupported()){

currentHls=
new Hls({

enableWorker:true,
lowLatencyMode:true

});

currentHls.loadSource(
channel.streamUrl
);

currentHls.attachMedia(
video
);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){

video.play();

}
);

}else{

video.src=
channel.streamUrl;

video.play();

}

}

/* ====================================
CLOSE PLAYER
==================================== */

function closePlayer(){

document
.getElementById(
"playerModal"
)
.style.display=
"none";

const video=
document
.getElementById(
"videoPlayer"
);

video.pause();

video.src="";

if(currentHls){

currentHls.destroy();

}

}

/* ====================================
AUTO REFRESH LIVE STATUS
==================================== */

setInterval(()=>{

freeChannels.forEach(channel=>{

channel.live=
Math.random()>0.08;

channel.views=
Math.floor(
Math.random()*500000
);

});

},10000);

/* ====================================
INIT
==================================== */

updateStats();

renderChannels(filteredChannels);

</script>

</body>
</html>
