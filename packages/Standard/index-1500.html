*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#050816;color:#eaf0ff}
body{display:flex}
.sidebar{width:260px;flex:0 0 260px;background:#0a1020;border-right:1px solid #202a42;padding:18px 12px;overflow:hidden}
.brand{font-weight:900;font-size:17px;line-height:1.25;margin:0 8px 3px}
.sub{font-size:10px;color:#7f8aa6;margin:0 8px 18px}

.sidebtn{width:100%;border:0;background:transparent;color:#b7c1d9;text-align:left;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:12px}
.sidebtn:hover,.sidebtn.active{background:#141e36;color:#fff}
.main{min-width:0;flex:1;display:flex;flex-direction:column;height:100vh}
.top{height:62px;flex:0 0 62px;border-bottom:1px solid #202a42;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#070c18}
.search{flex:1;max-width:720px;background:#0d1528;border:1px solid #26324d;color:#fff;border-radius:9px;padding:11px 13px;outline:none}
.search:focus{border-color:#5877b8}
.stats{display:flex;gap:8px;font-size:11px;color:#94a0bb}
.stat{padding:8px 9px;background:#0d1528;border:1px solid #202a42;border-radius:8px;white-space:nowrap}
.content{min-height:0;flex:1;display:flex;flex-direction:column;padding:12px 16px}
.player-wrap{height:285px;flex:0 0 285px;display:flex;gap:12px}
.player{min-width:0;flex:1;background:#000;border:1px solid #202a42;border-radius:10px;position:relative;overflow:hidden}
video{width:100%;height:100%;display:block;background:#000}
.live{position:absolute;left:10px;top:10px;background:#e11d48;color:#fff;padding:5px 7px;border-radius:5px;font-size:10px;font-weight:900}
.now{position:absolute;left:10px;bottom:10px;right:10px;background:rgba(0,0,0,.62);padding:8px 10px;border-radius:6px;font-size:12px}
.controls{width:205px;flex:0 0 205px;background:#0b1222;border:1px solid #202a42;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px}
.ctrl{border:1px solid #26324d;background:#111a2e;color:#dbe5ff;border-radius:7px;padding:8px;cursor:pointer;font-size:11px}
.ctrl:hover{background:#18243e}
.channel-wrapper{min-height:0;flex:1;margin-top:12px;overflow-y:auto;padding-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.card{background:#0c1425;border:1px solid #202a42;border-radius:9px;padding:9px;cursor:pointer;min-height:78px}
.card:hover{border-color:#526caa;background:#101a30}
.card-id{font-size:10px;color:#7f8aa6;margin-bottom:6px;font-weight:800}
.card-name{font-size:12px;font-weight:800;line-height:1.25;color:#f3f6ff;min-height:30px}
.card-meta{font-size:10px;color:#71809f;margin-top:6px}
.empty{padding:30px;text-align:center;color:#7783a1}
@media(max-width:900px){
.sidebar{width:215px;flex-basis:215px}
.controls{width:160px;flex-basis:160px}
.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
}
@media(max-width:700px){
body{display:block;overflow:auto}
.sidebar{width:100%;height:auto;max-height:245px;overflow-y:auto}
.main{height:auto;min-height:calc(100vh - 245px)}
.top{height:auto;flex-wrap:wrap}
.stats{width:100%;overflow:auto}
.player-wrap{height:240px;flex-basis:240px}
.controls{display:none}
.channel-wrapper{overflow:visible}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>

let filtered = CHANNELS.slice();
let current = -1;
const favorites = new Set(JSON.parse(localStorage.getItem("btech_standard_favorites") || "[]"));
const video = document.getElementById("video");
let hls = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function render() {
  const grid = document.getElementById("grid");
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">No channels found.</div>';
    return;
  }
  grid.innerHTML = filtered.map((c, i) => `
    <div class="card" onclick="play(${i})">
      <div class="card-id">BTECH-TV → CH ${String(c.n).padStart(4,"0")}</div>
      <div class="card-name">${esc(c.title)}</div>
      <div class="card-meta">Global · AUTO ${favorites.has(c.n) ? " · ★" : ""}</div>
    </div>
  `).join("");
}

function play(i) {
  if (!filtered[i]) return;
  current = i;
  const c = filtered[i];
  document.getElementById("now").textContent = c.title;
  document.title = c.title + " — BTECH-TV WORLD PRO MAX";
  if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
  video.pause();
  video.removeAttribute("src");
  if (window.Hls && Hls.isSupported() && /\.m3u8($|\?)/i.test(c.url)) {
    hls = new Hls({enableWorker:true});
    hls.loadSource(c.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
  } else {
    video.src = c.url;
    video.play().catch(()=>{});
  }
}

function next() { if (filtered.length) play((current + 1 + filtered.length) % filtered.length); }
function prev() { if (filtered.length) play((current - 1 + filtered.length) % filtered.length); }
function mute() { video.muted = !video.muted; }
function full() { document.querySelector(".player").requestFullscreen?.(); }
async function pip() {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else if (document.pictureInPictureEnabled) await video.requestPictureInPicture();
  } catch(e) {}
}
function favorite() {
  if (current < 0 || !filtered[current]) return;
  const n = filtered[current].n;
  if (favorites.has(n)) favorites.delete(n); else favorites.add(n);
  localStorage.setItem("btech_standard_favorites", JSON.stringify([...favorites]));
  render();
}
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  filtered = CHANNELS.filter(c => c.title.toLowerCase().includes(q) || String(c.n).includes(q));
  render();
});
function filterLabel(i, el) {
  document.querySelectorAll(".sidebtn").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  // The supplied source M3U does not provide reliable normalized country/category/language
  // fields for all 1,500 slots, so sidebar buttons remain navigation/status controls rather
  // than falsely claiming a metadata filter.
  document.getElementById("search").value = el.textContent.trim();
  document.getElementById("search").dispatchEvent(new Event("input"));
}
render();
</script>
</body>
</html>
