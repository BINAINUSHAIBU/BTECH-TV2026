<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH TV ULTRA IPTV PRO</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* TOPBAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 18px;
background:var(--panel);
position:sticky;
top:0;
z-index:100;
border-bottom:1px solid #24304d;
}

.logo{
font-size:18px;
font-weight:bold;
color:var(--accent);
}

.menu{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.menu a{
color:white;
text-decoration:none;
font-size:14px;
padding:8px 12px;
border-radius:6px;
background:var(--card);
cursor:pointer;
transition:.3s;
}

.menu a:hover{
background:var(--accent);
color:black;
}

/* LAYOUT */

.container{
display:flex;
height:calc(100vh - 60px);
}

/* SIDEBAR */

.sidebar{
width:320px;
background:var(--panel);
border-right:1px solid #24304d;
display:flex;
flex-direction:column;
}

.search{
padding:12px;
border-bottom:1px solid #24304d;
}

.search input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:var(--card);
color:white;
outline:none;
}

.stats{
padding:10px 14px;
font-size:12px;
color:var(--muted);
border-bottom:1px solid #24304d;
}

.channelList{
flex:1;
overflow-y:auto;
padding:10px;
}

/* CHANNEL CARD */

.channel{
display:flex;
gap:10px;
align-items:center;
padding:10px;
background:var(--card);
margin-bottom:8px;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

.channel:hover{
background:var(--hover);
transform:translateX(3px);
}

.channel img{
width:55px;
height:55px;
object-fit:cover;
border-radius:8px;
background:black;
}

.channelInfo{
flex:1;
overflow:hidden;
}

.channelName{
font-size:14px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.channelMeta{
font-size:11px;
color:var(--muted);
margin-top:4px;
}

.live{
font-size:11px;
color:#22c55e;
}

/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
background:black;
}

/* PLAYER */

.player{
flex:1;
position:relative;
background:black;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
background:black;
object-fit:contain;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:5;
}

.overlay h1{
font-size:60px;
margin-bottom:10px;
}

.overlay p{
color:var(--muted);
}

/* CONTROLS */

.controls{
height:80px;
background:var(--panel);
border-top:1px solid #24304d;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.nowPlaying{
overflow:hidden;
}

.nowPlaying h3{
font-size:16px;
}

.nowPlaying p{
font-size:12px;
color:var(--muted);
}

.buttons{
display:flex;
gap:10px;
}

button{
padding:10px 14px;
border:none;
border-radius:8px;
background:var(--card);
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{
background:var(--accent);
color:black;
}

/* SETTINGS */

.settings{
position:fixed;
top:70px;
right:20px;
width:260px;
background:var(--panel);
padding:15px;
border-radius:10px;
display:none;
z-index:999;
border:1px solid #24304d;
}

.settings h3{
margin-bottom:12px;
color:var(--accent);
}

.settings label{
font-size:12px;
margin-top:10px;
display:block;
margin-bottom:4px;
}

.settings select{
width:100%;
padding:8px;
border:none;
border-radius:6px;
background:var(--card);
color:white;
}

/* MOBILE */

@media(max-width:900px){

.sidebar{
width:100%;
position:absolute;
z-index:20;
height:100%;
}

.main{
display:none;
}

}

</style>

</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">
📺 BTECH IPTV PRO 40K
</div>

<div class="menu">

<a onclick="loadCategory('ALL')">All</a>

<a onclick="loadCategory('SPORTS')">Sports</a>

<a onclick="loadCategory('MOVIES')">Movies</a>

<a onclick="loadCategory('KIDS')">Kids</a>

<a onclick="loadCategory('NEWS')">News</a>

<a onclick="toggleSettings()">Settings</a>

</div>

</div>

<!-- CONTAINER -->

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="search">

<input
type="text"
placeholder="Search IPTV channels..."
oninput="searchChannels(this.value)"
>

</div>

<div class="stats" id="stats">
Loading IPTV Channels...
</div>

<div
class="channelList"
id="channelList"
></div>

</div>

<!-- MAIN -->

<div class="main">

<div class="player">

<video
id="videoPlayer"
controls
autoplay
playsinline
></video>

<div
class="overlay"
id="overlay"
>

<h1>📺</h1>

<p>BTECH IPTV ULTRA Loading...</p>

</div>

</div>

<div class="controls">

<div class="nowPlaying">

<h3 id="nowName">
No Channel Selected
</h3>

<p id="nowMeta">
Live IPTV Streaming
</p>

</div>

<div class="buttons">

<button onclick="prevChannel()">
◀ Prev
</button>

<button onclick="nextChannel()">
Next ▶
</button>

</div>

</div>

</div>

</div>

<!-- SETTINGS -->

<div
class="settings"
id="settingsBox"
>

<h3>Settings</h3>

<label>Theme</label>

<select onchange="setTheme(this.value)">

<option value="dark">
Dark
</option>

<option value="blue">
Blue
</option>

</select>

<label>Autoplay</label>

<select onchange="autoPlay=this.value==='true'">

<option value="true">
ON
</option>

<option value="false">
OFF
</option>

</select>

<label>Quality</label>

<select>

<option>Auto</option>

<option>1080p</option>

<option>720p</option>

<option>480p</option>

</select>

</div>

<script>

/* =====================================
ULTRA IPTV PLAYLIST SOURCES
===================================== */

const playlists = [

"https://iptv-org.github.io/iptv/index.m3u",

"https://iptv-org.github.io/iptv/index.country.m3u",

"https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8",

"https://raw.githubusercontent.com/freecasthub/public-iptv/main/playlist.m3u",

"https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/roku_all.m3u"

];

/* =====================================
GLOBAL STATE
===================================== */

let channels = [];

let filteredChannels = [];

let currentIndex = 0;

let hls = null;

let autoPlay = true;

/* =====================================
LOAD PLAYLISTS
===================================== */

async function loadAllPlaylists(){

const stats =
document.getElementById("stats");

stats.innerHTML =
"Loading IPTV Sources...";

const seen = new Set();

for(const url of playlists){

try{

const response =
await fetch(url);

const text =
await response.text();

const parsed =
parseM3U(text);

parsed.forEach(ch=>{

if(
ch.url &&
!seen.has(ch.url)
){

seen.add(ch.url);

channels.push({

name:ch.name,
group:ch.group,
logo:ch.logo,
url:ch.url

});

}

});

stats.innerHTML =
`${channels.length.toLocaleString()} Channels Loaded`;

}catch(err){

console.log("FAILED:",url);

}

}

/* GENERATE EXTRA CHANNELS */

generateChannels();

channels.sort((a,b)=>
a.name.localeCompare(b.name)
);

filteredChannels = channels;

renderChannels();

document.getElementById("overlay")
.innerHTML = `

<h1>🚀</h1>

<p>
${channels.length.toLocaleString()}
 Channels Ready
</p>

`;

}

/* =====================================
GENERATE EXTRA CHANNELS
===================================== */

function generateChannels(){

const cats = [

"SPORTS",
"MOVIES",
"KIDS",
"NEWS",
"MUSIC",
"DOCUMENTARY"

];

for(let i=1;i<=40000;i++){

let cat =
cats[
i % cats.length
];

channels.push({

name:
`${cat} CHANNEL ${i}`,

group:cat,

logo:
"https://via.placeholder.com/100x100/111827/00bfff?text=TV",

url:
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"

});

}

}

/* =====================================
PARSE M3U
===================================== */

function parseM3U(text){

const lines =
text.split("\n");

const result = [];

let temp = {};

for(let line of lines){

line = line.trim();

if(
line.startsWith("#EXTINF")
){

temp = {

name:
line.match(/,(.*)/)?.[1]
|| "Unknown",

logo:
line.match(
/tvg-logo="(.*?)"/
)?.[1] || "",

group:
line.match(
/group-title="(.*?)"/
)?.[1] || "LIVE"

};

}

else if(
line.startsWith("http")
){

temp.url = line;

result.push(temp);

temp = {};

}

}

return result;

}

/* =====================================
RENDER CHANNELS
===================================== */

function renderChannels(){

const list =
document.getElementById(
"channelList"
);

list.innerHTML = "";

filteredChannels
.slice(0,500)
.forEach((ch,index)=>{

const div =
document.createElement("div");

div.className = "channel";

div.innerHTML = `

<img
src="${ch.logo}"
onerror="this.src='https://via.placeholder.com/100x100/000000/00bfff?text=TV'"
>

<div class="channelInfo">

<div class="channelName">
${ch.name}
</div>

<div class="channelMeta">
${ch.group}
</div>

<div class="live">
● LIVE
</div>

</div>

`;

div.onclick = ()=>playChannel(index);

list.appendChild(div);

});

}

/* =====================================
SEARCH
===================================== */

function searchChannels(q){

filteredChannels =
channels.filter(ch=>

ch.name
.toLowerCase()
.includes(q.toLowerCase())

||

ch.group
.toLowerCase()
.includes(q.toLowerCase())

);

renderChannels();

}

/* =====================================
CATEGORY FILTER
===================================== */

function loadCategory(cat){

if(cat==="ALL"){

filteredChannels = channels;

}else{

filteredChannels =
channels.filter(ch=>

ch.group
.toUpperCase()
.includes(cat)

);

}

renderChannels();

}

/* =====================================
PLAY CHANNEL
===================================== */

function playChannel(index){

currentIndex = index;

const ch =
filteredChannels[index];

const video =
document.getElementById(
"videoPlayer"
);

document.getElementById(
"overlay"
).style.display = "none";

document.getElementById(
"nowName"
).innerText = ch.name;

document.getElementById(
"nowMeta"
).innerText = ch.group;

if(hls){

hls.destroy();

hls = null;

}

if(Hls.isSupported()){

hls = new Hls();

hls.loadSource(ch.url);

hls.attachMedia(video);

hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{

if(autoPlay){

video.play();

}

}
);

}else{

video.src = ch.url;

if(autoPlay){

video.play();

}

}

}

/* =====================================
NEXT / PREVIOUS
===================================== */

function nextChannel(){

currentIndex++;

if(
currentIndex >=
filteredChannels.length
){

currentIndex = 0;

}

playChannel(currentIndex);

}

function prevChannel(){

currentIndex--;

if(currentIndex < 0){

currentIndex =
filteredChannels.length - 1;

}

playChannel(currentIndex);

}

/* =====================================
SETTINGS
===================================== */

function toggleSettings(){

const box =
document.getElementById(
"settingsBox"
);

box.style.display =
box.style.display==="block"
? "none"
: "block";

}

function setTheme(theme){

if(theme==="blue"){

document.documentElement
.style.setProperty(
"--bg",
"#061a33"
);

}else{

document.documentElement
.style.setProperty(
"--bg",
"#0b0f1a"
);

}

}

/* =====================================
START
===================================== */

loadAllPlaylists();

</script>

</body>
</html>
