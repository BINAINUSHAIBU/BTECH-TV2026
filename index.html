<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>BTECH-TV USER DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1e293b;
--hover:#334155;
--accent:#00bfff;
--text:white;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* TOPBAR */

.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.logo{
font-size:22px;
font-weight:bold;
color:var(--accent);
}

/* LAYOUT */

.container{
display:flex;
height:calc(100vh - 65px);
}

/* SIDEBAR */

.sidebar{
width:240px;
background:#0f172a;
padding:15px;
overflow:auto;
}

.cat{
padding:12px;
background:var(--card);
margin:10px 0;
border-radius:8px;
cursor:pointer;
}

.cat:hover{
background:var(--hover);
}

/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* PLAYER */

.player{
height:350px;
background:black;
position:relative;
}

video{
width:100%;
height:100%;
object-fit:contain;
}

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:6px 12px;
border-radius:20px;
}

/* NOW PLAYING */

.now{
background:var(--panel);
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.btn{
padding:10px 14px;
background:var(--card);
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

/* CHANNEL GRID */

.channels{
flex:1;
overflow:auto;
padding:10px;
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(280px,1fr));
gap:10px;
}

.channel{
background:var(--card);
padding:12px;
border-radius:10px;
cursor:pointer;
}

.channel:hover{
background:var(--hover);
}

.channel img{
width:55px;
height:55px;
border-radius:10px;
}

/* RIGHT PANEL */

.panel{
width:300px;
background:var(--panel);
padding:15px;
overflow:auto;
}

.box{
background:var(--card);
padding:15px;
margin-bottom:15px;
border-radius:10px;
}

input{
width:100%;
padding:12px;
background:#0f172a;
border:none;
color:white;
margin-top:10px;
border-radius:8px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
background:#0f172a;
padding:15px;
text-align:center;
border-radius:8px;
}

/* MOBILE */

@media(max-width:1000px){

.sidebar,
.panel{
display:none;
}

.player{
height:250px;
}

}

</style>
</head>

<body>

<!-- TOP -->

<div class="topbar">

<div class="logo">
📺 BTECH-TV USER
</div>

<button class="btn"
onclick="toggleTheme()">

🌙 Theme

</button>

</div>


<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="cat"
onclick="filterCat('All')">
📺 All
</div>

<div class="cat"
onclick="filterCat('Sports')">
🏆 Sports
</div>

<div class="cat"
onclick="filterCat('Movies')">
🎬 Movies
</div>

<div class="cat"
onclick="filterCat('News')">
📰 News
</div>

<div class="cat"
onclick="filterCat('Kids')">
🧸 Kids
</div>

<div class="cat"
onclick="filterCat('Music')">
🎵 Music
</div>

</div>



<!-- MAIN -->

<div class="main">

<div class="player">

<div class="live">
🔴 LIVE
</div>

<video
id="video"
controls
autoplay>

</video>

</div>


<div class="now">

<div>

<h3 id="name">
No Channel
</h3>

<p id="group">

Select channel

</p>

</div>


<div>

<button class="btn"
onclick="prevChannel()">

◀

</button>

<button class="btn"
onclick="nextChannel()">

▶

</button>

</div>

</div>



<div
class="channels"
id="channels">

</div>

</div>



<!-- RIGHT PANEL -->

<div class="panel">

<div class="box">

<h3>

Search

</h3>

<input

placeholder="Search channels"

oninput="
searchChannels(this.value)
">

</div>



<div class="box">

<h3>

Statistics

</h3>

<div class="stats">

<div class="stat">

<h4>Total</h4>

<p id="total">

0

</p>

</div>


<div class="stat">

<h4>Free</h4>

<p id="free">

0

</p>

</div>


<div class="stat">

<h4>Locked</h4>

<p id="locked">

0

</p>

</div>


<div class="stat">

<h4>Live</h4>

<p id="live">

0

</p>

</div>

</div>

</div>



<div class="box">

<h3>

Settings

</h3>

<br>

<label>

<input
type="checkbox"
checked
onchange="
autoPlay=
this.checked
">

Auto Play

</label>

<br><br>

<label>

<input
type="checkbox"
checked
onclick="
toggleTheme()
">

Dark Mode

</label>

</div>

</div>

</div>



<script>

let channels=[];

let filtered=[];

let current=0;

let autoPlay=true;

let hls;


/* SAMPLE CHANNELS */

for(let i=1;i<=500;i++){

channels.push({

name:
"Channel "+i,

category:
["Sports",
"Movies",
"News",
"Kids",
"Music"]
[i%5],

url:
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",

logo:
"https://via.placeholder.com/60"

});

}

filtered=[...channels];

render();



function render(){

let html="";

filtered.forEach((c,i)=>{

html+=`

<div
class="channel"
onclick="
play(${i})
">

<img src="${c.logo}">

<h4>

${c.name}

</h4>

<small>

${c.category}

</small>

</div>

`;

});

channelsDiv.innerHTML=
html;

total.innerHTML=
channels.length;

}



function play(i){

current=i;

let ch=
filtered[i];

name.innerHTML=
ch.name;

group.innerHTML=
ch.category;

let video=
document.getElementById(
"video"
);

if(hls){

hls.destroy();

}

hls=
new Hls();

hls.loadSource(
ch.url
);

hls.attachMedia(
video
);

if(autoPlay)
video.play();

}



function nextChannel(){

current++;

if(
current>=filtered.length
)

current=0;

play(current);

}


function prevChannel(){

current--;

if(
current<0
)

current=
filtered.length-1;

play(current);

}



function searchChannels(q){

filtered=
channels.filter(

c=>

c.name
.toLowerCase()

.includes(
q.toLowerCase()
)

);

render();

}



function filterCat(cat){

if(cat==="All")

filtered=
channels;

else

filtered=
channels.filter(

c=>

c.category===cat

);

render();

}



function toggleTheme(){

document.body.classList.toggle(
"light"
);

}

</script>

</body>
</html>
