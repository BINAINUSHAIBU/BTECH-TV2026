<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV USER DASHBOARD (CLEAN)</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg);color:var(--text);overflow:hidden;}

.topbar{
height:60px;background:var(--panel);
display:flex;justify-content:space-between;align-items:center;
padding:0 15px;
}

.container{display:flex;height:calc(100vh - 60px);}

/* SIDEBAR */
.sidebar{
width:240px;background:#0f1628;padding:10px;overflow:auto;
}

.menu{
padding:12px;background:var(--card);margin-bottom:8px;
border-radius:8px;cursor:pointer;
}
.menu:hover,.menu.active{background:var(--accent);color:#000}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;}

.player{
height:320px;background:#000;position:relative;
display:flex;align-items:center;justify-content:center;
}

.player video{width:100%;height:100%;object-fit:contain;}

.overlay{
position:absolute;inset:0;
display:flex;align-items:center;justify-content:center;
background:rgba(0,0,0,.7);
}

/* CHANNELS */
.channels{
flex:1;overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:10px;padding:10px;
}

.channel{
background:var(--card);
padding:10px;border-radius:10px;
cursor:pointer;display:flex;justify-content:space-between;
}
.channel:hover{background:var(--hover)}
.channel.active{border:2px solid var(--accent)}

.badge{
padding:4px 8px;border-radius:10px;font-size:11px;
}
.free{background:#16a34a;}
.paid{background:#dc2626;}
.live{background:#2563eb;}
.off{background:#666;}
</style>
</head>

<body>

<div class="topbar">
<h3>📺 BTECH-TV CLEAN DASHBOARD</h3>
<button onclick="loadChannels()">Reload</button>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="menu active" onclick="filter('All')">All</div>
<div class="menu" onclick="filter('Sports')">Sports</div>
<div class="menu" onclick="filter('Movies')">Movies</div>
<div class="menu" onclick="filter('News')">News</div>
<div class="menu" onclick="filter('Kids')">Kids</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<div class="overlay" id="overlay">Loading Channels...</div>
<video id="video" controls autoplay></video>
</div>

<div class="channels" id="list"></div>

</div>

</div>

<script>

const ENGINE = {
max: 2000   // optimized (100K in browser will crash)
};

let channels = [];
let filtered = [];
let currentIndex = 0;
let hls = null;

const streams = [
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8",
"https://test-streams.mux.dev/test_002/stream.m3u8"
];

const cats = ["Sports","Movies","News","Kids","Music"];

/* LOAD */
function loadChannels(){
channels = [];

for(let i=1;i<=ENGINE.max;i++){
let cat = cats[i % cats.length];

channels.push({
id:i,
name:`BTECH ${cat} ${i}`,
category:cat,
type:i%3===0?"paid":"free",
live:Math.random()>0.2,
url:streams[i % streams.length]
});
}

filtered = [...channels];
render();
document.getElementById("overlay").style.display="none";
}

/* RENDER */
function render(){
const box = document.getElementById("list");
box.innerHTML="";

filtered.forEach((c,i)=>{
const div = document.createElement("div");
div.className="channel";

div.innerHTML=`
<div>
<div>${c.live?"🔴":"⚫"} ${c.name}</div>
<small>${c.category}</small>
</div>

<div>
<span class="badge ${c.type}">${c.type}</span>
<span class="badge ${c.live?'live':'off'}">${c.live?'LIVE':'OFF'}</span>
</div>
`;

div.onclick=()=>play(i,div);
box.appendChild(div);
});
}

/* PLAY */
function play(i,el){
currentIndex=i;
let c = filtered[i];

document.querySelectorAll(".channel")
.forEach(x=>x.classList.remove("active"));

if(el) el.classList.add("active");

let video = document.getElementById("video");

if(hls) hls.destroy();

if(Hls.isSupported()){
hls = new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* FILTER */
function filter(cat){
if(cat==="All") filtered=[...channels];
else filtered=channels.filter(c=>c.category===cat);
render();
}

/* START */
loadChannels();

</script>

</body>
</html>
