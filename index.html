<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV USER DASHBOARD (100K UPGRADED)</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
}

/* =========================
GLOBAL
========================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{cursor:pointer;border:none;}

/* =========================
TOPBAR
========================= */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo h2{
color:var(--accent);
font-size:22px;
}

.user-box{
display:flex;
align-items:center;
gap:12px;
}

.user-avatar{
width:42px;
height:42px;
border-radius:50%;
background:var(--accent);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
color:black;
}

/* =========================
LAYOUT
========================= */
.container{
display:flex;
height:calc(100vh - 65px);
}

/* =========================
SIDEBAR
========================= */
.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,.05);
}

.menu-item{
padding:13px;
margin-bottom:10px;
background:var(--card);
border-radius:10px;
cursor:pointer;
transition:.3s;
font-size:14px;
}

.menu-item:hover,
.menu-item.active{
background:var(--accent);
color:black;
}

/* =========================
MAIN
========================= */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* =========================
PLAYER
========================= */
.player{
height:340px;
background:black;
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
}

.live-badge{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:5;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.88);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
}

/* =========================
NOW PLAYING
========================= */
.now-playing{
background:var(--panel);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid rgba(255,255,255,.05);
border-bottom:1px solid rgba(255,255,255,.05);
}

.controls button{
padding:12px 16px;
background:var(--card);
border-radius:10px;
color:white;
margin-left:8px;
}

/* =========================
CHANNELS
========================= */
.channels{
flex:1;
overflow-y:auto;
padding:12px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:14px;
border-radius:12px;
display:flex;
justify-content:space-between;
cursor:pointer;
transition:.3s;
}

.channel:hover{background:var(--hover);}
.channel.active{border:1px solid var(--accent);background:#00bfff22;}

.channel-left{display:flex;gap:12px;align-items:center;}

.channel-left img{
width:60px;height:60px;border-radius:10px;
}

.badge{
padding:5px 10px;border-radius:20px;font-size:11px;
}
.free{background:#16a34a;}
.paid{background:#dc2626;}
.live{background:#2563eb;}
.offline{background:#64748b;}

/* =========================
RIGHT PANEL
========================= */
.right-panel{
width:320px;
background:var(--panel);
padding:15px;
overflow-y:auto;
border-left:1px solid rgba(255,255,255,.05);
}

.panel-card{
background:var(--card);
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

.search-box{
width:100%;
padding:12px;
border-radius:10px;
background:#0f172a;
color:white;
margin-top:10px;
}

.action-btn{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
background:var(--accent);
font-weight:bold;
}

/* =========================
MOBILE
========================= */
@media(max-width:1000px){
.sidebar,.right-panel{display:none;}
.channels{grid-template-columns:1fr;}
.player{height:250px;}
}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<div class="logo"><h2>📺 BTECH-TV PRO USER</h2></div>

<div class="user-box">
<div class="user-avatar">U</div>
<div>
<h4>Welcome User</h4>
<small>100K Streaming Engine</small>
</div>
</div>
</div>

<!-- CONTAINER -->
<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="menu-item active" onclick="filterCategory('All')">📺 All Channels</div>
<div class="menu-item" onclick="filterCategory('Sports')">🏆 Sports</div>
<div class="menu-item" onclick="filterCategory('Movies')">🎬 Movies</div>
<div class="menu-item" onclick="filterCategory('News')">📰 News</div>
<div class="menu-item" onclick="filterCategory('Kids')">🧸 Kids</div>

<hr style="margin:10px 0;border:0;border-top:1px solid #222;">

<a href="https://superadminbtech-tv.netlify.app/super_admin"><div class="menu-item">⚙ Super Admin</div></a>
<a href="https://superadminbtech-tv.netlify.app/user_manager"><div class="menu-item">👥 User Manager</div></a>
<a href="https://superadminbtech-tv.netlify.app/pay_to-view"><div class="menu-item">💳 Pay To View</div></a>
<a href="https://superadminbtech-tv.netlify.app/locked_channels"><div class="menu-item">🔒 Locked Channels</div></a>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<div class="live-badge">🔴 LIVE</div>
<video id="videoPlayer" controls autoplay playsinline></video>

<div class="overlay" id="overlay">
<h1>🚀</h1>
<p>Loading 100K BTECH-TV Engine...</p>
</div>
</div>

<div class="now-playing">
<div>
<h3 id="channelName">No Channel Selected</h3>
<p id="channelCategory">BTECH-TV</p>
</div>

<div class="controls">
<button onclick="prevChannel()">◀ Prev</button>
<button onclick="nextChannel()">Next ▶</button>
</div>
</div>

<div class="channels" id="channelList"></div>

</div>

<!-- RIGHT PANEL -->
<div class="right-panel">

<div class="panel-card">
<h3>🔍 Search</h3>
<input class="search-box" oninput="searchChannels(this.value)" placeholder="Search 100K channels">
<button class="action-btn" onclick="loadEngine()">🚀 Load 100K Engine</button>
</div>

<div class="panel-card">
<h3>📊 Stats</h3>
<p>Total: <span id="total">0</span></p>
<p>Free: <span id="free">0</span></p>
<p>Paid: <span id="paid">0</span></p>
<p>Live: <span id="live">0</span></p>
</div>

</div>

</div>

<script>

/* =========================
ENGINE (100K)
========================= */
const ENGINE={
maxChannels:100000,
renderLimit:250
};

let channels=[];
let filteredChannels=[];
let currentIndex=0;
let currentPage=0;
let currentHls=null;

const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8",
"https://test-streams.mux.dev/test_002/stream.m3u8"
];

const categories=["Sports","Movies","News","Kids","Music","Africa","USA","UK"];

/* =========================
LOAD ENGINE
========================= */
function loadEngine(){

channels=[];

for(let i=1;i<=ENGINE.maxChannels;i++){

let cat=categories[i%categories.length];

channels.push({
id:i,
name:"BTECH "+cat+" LIVE "+i,
category:cat,
type:i%3===0?"paid":"free",
live:Math.random()>0.15,
viewers:Math.floor(Math.random()*1000000),
logo:"https://via.placeholder.com/60",
url:streams[i%streams.length]
});

}

filteredChannels=[...channels];
updateStats();
renderChannels();
document.getElementById("overlay").style.display="none";
}

/* =========================
RENDER
========================= */
function renderChannels(reset=true){

const box=document.getElementById("channelList");

if(reset){
box.innerHTML="";
currentPage=0;
}

const start=currentPage*ENGINE.renderLimit;
const end=start+ENGINE.renderLimit;

filteredChannels.slice(start,end).forEach((c,i)=>{

const div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<div class="channel-left">
<img src="${c.logo}">
<div>
<h4>${c.live?"🔴":"⚫"} ${c.name}</h4>
<small>${c.category} • ${c.viewers}</small>
</div>
</div>

<div>
<span class="badge ${c.type}">${c.type}</span>
<span class="badge ${c.live?'live':'offline'}">${c.live?'LIVE':'OFF'}</span>
</div>
`;

div.onclick=()=>playChannel(start+i,div);
box.appendChild(div);

});
}

/* =========================
PLAY
========================= */
function playChannel(index,el){

currentIndex=index;
let c=filteredChannels[index];

document.getElementById("channelName").innerText=c.name;
document.getElementById("channelCategory").innerText=c.category;

const video=document.getElementById("videoPlayer");

if(currentHls) currentHls.destroy();

if(Hls.isSupported()){
currentHls=new Hls();
currentHls.loadSource(c.url);
currentHls.attachMedia(video);
currentHls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}

document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));
if(el) el.classList.add("active");

}

/* =========================
NAV
========================= */
function nextChannel(){
currentIndex++;
if(currentIndex>=filteredChannels.length) currentIndex=0;
playChannel(currentIndex);
}

function prevChannel(){
currentIndex--;
if(currentIndex<0) currentIndex=filteredChannels.length-1;
playChannel(currentIndex);
}

/* =========================
FILTER
========================= */
function filterCategory(cat){

if(cat==="All") filteredChannels=[...channels];
else filteredChannels=channels.filter(c=>c.category.includes(cat));

renderChannels();
}

/* =========================
SEARCH
========================= */
function searchChannels(q){
filteredChannels=channels.filter(c=>
c.name.toLowerCase().includes(q.toLowerCase()) ||
c.category.toLowerCase().includes(q.toLowerCase())
);
renderChannels();
}

/* =========================
STATS
========================= */
function updateStats(){

document.getElementById("total").innerText=channels.length;
document.getElementById("free").innerText=channels.filter(c=>c.type==="free").length;
document.getElementById("paid").innerText=channels.filter(c=>c.type==="paid").length;
document.getElementById("live").innerText=channels.filter(c=>c.live).length;

}

/* START */
loadEngine();

</script>

</body>
</html>
