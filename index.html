<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 

<title>BTECH-TV PRO ULTRA MAX USER DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00d4ff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{cursor:pointer;border:none;}

/* TOPBAR */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo h2{color:var(--accent);}

.container{display:flex;height:calc(100vh - 65px);}

/* SIDEBAR */
.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
}

.menu-item{
padding:13px;
margin-bottom:10px;
background:var(--card);
border-radius:10px;
cursor:pointer;
transition:.3s;
font-size:14px;
}

.menu-item:hover,.menu-item.active{
background:var(--accent);
color:#000;
transform:translateX(4px);
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

.player{
height:360px;
background:#000;
position:relative;
}

video{width:100%;height:100%;object-fit:contain;}

.overlay{
position:absolute;inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
background:rgba(0,0,0,.85);
}

.live-badge{
position:absolute;
top:15px;left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
}

/* CHANNELS */
.channels{
flex:1;
overflow-y:auto;
padding:12px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:14px;
border-radius:12px;
display:flex;
justify-content:space-between;
cursor:pointer;
transition:.3s;
}

.channel:hover{
background:var(--hover);
transform:translateY(-2px);
}

.channel.active{border:1px solid var(--accent);background:#00d4ff22;}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
}

.free{background:#16a34a;}
.paid{background:#dc2626;}
.live{background:#2563eb;}
.offline{background:#64748b;}

.right-panel{
width:320px;
background:var(--panel);
padding:15px;
overflow-y:auto;
}

.panel-card{
background:var(--card);
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

.search-box{
width:100%;
padding:12px;
border-radius:10px;
background:#0f172a;
color:#fff;
}

.action-btn{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
background:var(--accent);
color:#000;
font-weight:bold;
}

</style>

</head>

<body>

<div class="topbar">
<div class="logo"><h2>📺 BTECH-TV USER DASHBOARD</h2></div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="menu-item active" onclick="filterCategory('ALL',event)">📺 All Channels</div>
<div class="menu-item" onclick="filterCategory('SPORTS',event)">🏆 Sports</div>
<div class="menu-item" onclick="filterCategory('MOVIES',event)">🎬 Movies</div>
<div class="menu-item" onclick="filterCategory('NEWS',event)">📰 News</div>
<div class="menu-item" onclick="filterCategory('KIDS',event)">🧸 Kids</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">

<div class="live-badge">🔴 LIVE</div>

<video id="videoPlayer" controls autoplay playsinline></video>

<div class="overlay" id="overlay">
<h1>🚀</h1>
<p>Loading BTECH-TV Engine...</p>
</div>

</div>

<div class="channels" id="channelList"></div>

</div>

<!-- RIGHT PANEL -->
<div class="right-panel">

<div class="panel-card">
<h3>🔍 Search</h3>
<input class="search-box" oninput="searchChannels(this.value)" placeholder="Search channels...">
<button class="action-btn" onclick="loadPlaylists()">Reload Engine</button>
</div>

<div class="panel-card">
<h3>📊 Stats</h3>
<p>Total: <span id="total">0</span></p>
<p>Free: <span id="free">0</span></p>
<p>Paid: <span id="paid">0</span></p>
<p>Live: <span id="live">0</span></p>
</div>

</div>

</div>

<script>

/* =========================
ENGINE
========================= */

const ENGINE = {
maxVirtualChannels: 100000,
renderLimit: 200
};

let channels = [];
let filteredChannels = [];
let currentIndex = 0;
let currentPage = 0;
let currentHls = null;
let autoPlay = true;

/* PLAYLISTS */
const playlists = [
"https://iptv-org.github.io/iptv/index.m3u",
"https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8"
];

/* STREAMS */
const fallbackStreams = [
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* LOAD */
async function loadPlaylists(){

channels = [];
const seen = new Set();

for(const url of playlists){
try{
const res = await fetch(url);
const text = await res.text();
const parsed = parseM3U(text);

parsed.forEach(ch=>{
if(ch.url && !seen.has(ch.url)){
seen.add(ch.url);

channels.push({
id:channels.length+1,
name:ch.name || "Unknown",
category:(ch.group || "LIVE").toUpperCase(),
type:Math.random()>0.7?"paid":"free",
live:true,
viewers:Math.floor(Math.random()*1000000),
logo:ch.logo || "",
url:ch.url
});
}
});
}catch(e){}
}

/* VIRTUAL */
for(let i=1;i<=ENGINE.maxVirtualChannels;i++){

channels.push({
id:channels.length+1,
name:`BTECH LIVE ${i}`,
category:i%2===0?"SPORTS":"MOVIES",
type:i%3===0?"paid":"free",
live:true,
viewers:Math.floor(Math.random()*100000),
logo:"",
url:fallbackStreams[i%fallbackStreams.length]
});

}

filteredChannels = [...channels];
updateStats();
renderChannels();
document.getElementById("overlay").style.display="none";
}

/* M3U */
function parseM3U(text){
const lines=text.split("\n");
let temp={},out=[];
for(let l of lines){
l=l.trim();
if(l.startsWith("#EXTINF")){
temp.name=(l.match(/,(.*)/)||[])[1]||"Unknown";
temp.group=(l.match(/group-title="(.*?)"/)||[])[1]||"LIVE";
temp.logo="";
}
else if(l.startsWith("http")){
temp.url=l;
out.push(temp);
temp={};
}
}
return out;
}

/* RENDER */
function renderChannels(reset=true){

const box=document.getElementById("channelList");
if(reset){box.innerHTML="";currentPage=0;}

const start=currentPage*ENGINE.renderLimit;
const end=start+ENGINE.renderLimit;

filteredChannels.slice(start,end).forEach((c,i)=>{

const div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<div>
<b>${c.name}</b><br>
<small>${c.category}</small>
</div>

<div>
<span class="badge ${c.type}">${c.type}</span>
</div>
`;

div.onclick=()=>playChannel(start+i,div);
box.appendChild(div);

});

}

/* PLAY */
function playChannel(i,el){

currentIndex=i;
const c=filteredChannels[i];
const v=document.getElementById("videoPlayer");

if(currentHls) currentHls.destroy();

if(Hls.isSupported()){
currentHls=new Hls();
currentHls.loadSource(c.url);
currentHls.attachMedia(v);
currentHls.on(Hls.Events.MANIFEST_PARSED,()=>autoPlay&&v.play());
}else{
v.src=c.url;
autoPlay&&v.play();
}

document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));
if(el) el.classList.add("active");

}

/* FILTER */
function filterCategory(cat){

if(cat==="ALL") filteredChannels=[...channels];
else filteredChannels=channels.filter(c=>c.category.includes(cat));

renderChannels();
}

/* SEARCH */
function searchChannels(q){
q=q.toLowerCase();
filteredChannels=channels.filter(c=>
c.name.toLowerCase().includes(q) ||
c.category.toLowerCase().includes(q)
);
renderChannels();
}

/* STATS */
function updateStats(){
document.getElementById("total").innerText=channels.length;
document.getElementById("free").innerText=channels.filter(c=>c.type==="free").length;
document.getElementById("paid").innerText=channels.filter(c=>c.type==="paid").length;
document.getElementById("live").innerText=channels.length;
}

/* START */
loadPlaylists();

</script>

</body>
</html>
