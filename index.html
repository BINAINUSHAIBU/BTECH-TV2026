<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV PRO ULTRA MAX USER DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00d4ff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{
cursor:pointer;
border:none;
}

/* =========================
TOPBAR
========================= */

.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo h2{
font-size:20px;
color:var(--accent);
}

.user-box{
display:flex;
align-items:center;
gap:10px;
}

.user-avatar{
width:40px;
height:40px;
border-radius:50%;
background:var(--accent);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
color:black;
}

/* =========================
LAYOUT
========================= */

.container{
display:flex;
height:calc(100vh - 65px);
}

/* =========================
SIDEBAR
========================= */

.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,.05);
}

.menu-item{
padding:12px;
margin-bottom:8px;
background:var(--card);
border-radius:10px;
cursor:pointer;
transition:.3s;
font-size:14px;
}

.menu-item:hover,
.menu-item.active{
background:var(--accent);
color:black;
}

/* =========================
MAIN
========================= */

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* =========================
PLAYER
========================= */

.player{
height:340px;
background:black;
position:relative;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
}

.live-badge{
position:absolute;
top:10px;
left:10px;
background:red;
padding:6px 12px;
border-radius:20px;
font-size:12px;
}

/* =========================
NOW PLAYING
========================= */

.now-playing{
background:var(--panel);
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.controls button{
padding:8px 12px;
border-radius:8px;
background:var(--card);
color:white;
}

/* =========================
CHANNEL LIST
========================= */

.channels{
flex:1;
overflow-y:auto;
padding:10px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
}

.channel{
background:var(--card);
padding:12px;
border-radius:10px;
cursor:pointer;
display:flex;
justify-content:space-between;
transition:.3s;
}

.channel:hover{
background:var(--hover);
}

.channel.active{
border:2px solid var(--accent);
}

small{
color:var(--muted);
}

/* =========================
RIGHT PANEL (USER ONLY STATS LIGHT)
========================= */

.right-panel{
width:300px;
background:var(--panel);
padding:15px;
overflow-y:auto;
border-left:1px solid rgba(255,255,255,.05);
}

.panel-card{
background:var(--card);
padding:12px;
border-radius:10px;
margin-bottom:10px;
}

.search-box{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#0f1628;
color:white;
}

.action-btn{
width:100%;
padding:10px;
margin-top:10px;
background:var(--accent);
border-radius:8px;
font-weight:bold;
color:black;
}

</style>

</head>

<body>

<!-- TOPBAR -->
<div class="topbar">

<div class="logo">
<h2>📺 BTECH-TV USER DASHBOARD</h2>
</div>

<div class="user-box">
<div class="user-avatar">U</div>
<div>
<h4>User</h4>
<small>Streaming Engine</small>
</div>
</div>

</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="menu-item active" onclick="filterCategory('ALL',event)">📺 All</div>
<div class="menu-item" onclick="filterCategory('SPORTS',event)">🏆 Sports</div>
<div class="menu-item" onclick="filterCategory('MOVIES',event)">🎬 Movies</div>
<div class="menu-item" onclick="filterCategory('NEWS',event)">📰 News</div>
<div class="menu-item" onclick="filterCategory('KIDS',event)">🧸 Kids</div>
<div class="menu-item" onclick="filterCategory('MUSIC',event)">🎵 Music</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<div class="live-badge">🔴 LIVE</div>
<video id="videoPlayer" controls autoplay></video>
</div>

<div class="now-playing">
<h3 id="channelName">No Channel Selected</h3>

<div class="controls">
<button onclick="prevChannel()">◀</button>
<button onclick="nextChannel()">▶</button>
</div>
</div>

<div class="channels" id="channelList"></div>

</div>

<!-- RIGHT PANEL -->
<div class="right-panel">

<div class="panel-card">
<h3>🔍 Search</h3>
<input class="search-box" oninput="searchChannels(this.value)" placeholder="Search channels...">
</div>

<div class="panel-card">
<button class="action-btn" onclick="loadPlaylists()">🔄 Reload Channels</button>
</div>

</div>

</div>

<script>

/* =========================
ENGINE
========================= */

let channels=[];
let filtered=[];
let index=0;
let hls;

const playlists=[
"https://iptv-org.github.io/iptv/index.m3u"
];

const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* LOAD */
async function loadPlaylists(){

channels=[];

for(const url of playlists){
try{
const res=await fetch(url);
const text=await res.text();
channels.push(...parseM3U(text));
}catch(e){}
}

/* ADD VIRTUAL CHANNELS */
for(let i=0;i<500;i++){

const cats=["SPORTS","MOVIES","NEWS","KIDS"];

channels.push({
name:"BTECH "+cats[i%4]+" "+i,
category:cats[i%4],
url:streams[i%2]
});

}

filtered=[...channels];
render();

}

/* PARSE */
function parseM3U(text){

const lines=text.split("\n");
const out=[];
let temp={};

for(let l of lines){

l=l.trim();

if(l.startsWith("#EXTINF")){
temp.name=l.split(",")[1]||"Unknown";
}

if(l.startsWith("http")){
temp.url=l;
out.push(temp);
temp={};
}

}

return out;
}

/* RENDER */
function render(){

const box=document.getElementById("channelList");
box.innerHTML="";

filtered.forEach((c,i)=>{

const div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<div>
<h4>${c.name}</h4>
<small>${c.category||"LIVE"}</small>
</div>
`;

div.onclick=()=>play(i);
box.appendChild(div);

});

}

/* PLAY */
function play(i){

index=i;
const c=filtered[i];

document.getElementById("channelName").innerText=c.name;

if(hls) hls.destroy();

const video=document.getElementById("videoPlayer");

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
}else{
video.src=c.url;
}

video.play();

}

/* NEXT / PREV */
function nextChannel(){
index=(index+1)%filtered.length;
play(index);
}

function prevChannel(){
index=(index-1+filtered.length)%filtered.length;
play(index);
}

/* FILTER */
function filterCategory(cat,e){

document.querySelectorAll(".menu-item")
.forEach(m=>m.classList.remove("active"));

if(e) e.target.classList.add("active");

filtered = cat==="ALL"
? channels
: channels.filter(c=>c.category===cat);

render();

}

/* SEARCH */
function searchChannels(q){
filtered=channels.filter(c=>
c.name.toLowerCase().includes(q.toLowerCase())
);
render();
}

/* START */
loadPlaylists();

</script>

</body>
</html>
