<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV USER DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* =========================
TOPBAR
========================= */

.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{
color:var(--accent);
font-size:18px;
}

.topbar input{
padding:10px;
border-radius:8px;
border:none;
background:#0f1628;
color:white;
width:250px;
}

/* =========================
LAYOUT
========================= */

.container{
display:flex;
height:calc(100vh - 60px);
}

/* =========================
SIDEBAR
========================= */

.sidebar{
width:240px;
background:#0f1628;
padding:10px;
overflow-y:auto;
}

.cat{
padding:10px;
margin:6px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
transition:0.3s;
font-size:13px;
}

.cat:hover{
background:var(--hover);
}

/* =========================
MAIN
========================= */

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* PLAYER */

.player{
height:320px;
background:black;
position:relative;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
}

.live{
position:absolute;
top:10px;
left:10px;
background:red;
padding:6px 12px;
border-radius:20px;
font-size:12px;
}

/* NOW PLAYING */

.now{
background:var(--panel);
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.now h3{
font-size:14px;
}

.buttons button{
padding:8px 12px;
border:none;
background:var(--card);
color:white;
border-radius:6px;
cursor:pointer;
}

.buttons button:hover{
background:var(--hover);
}

/* CHANNELS */

.channels{
flex:1;
overflow-y:auto;
padding:10px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
}

.channel{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
display:flex;
justify-content:space-between;
transition:0.3s;
}

.channel:hover{
background:var(--hover);
}

.channel.active{
border:2px solid var(--accent);
}

.channel h4{
font-size:13px;
}

small{
color:var(--muted);
font-size:11px;
}

</style>
</head>

<body>

<div class="topbar">
<h2>📺 BTECH-TV USER DASHBOARD</h2>
<input placeholder="Search channels..." oninput="searchChannels(this.value)">
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="cat" onclick="filterCat('All')">📺 All</div>
<div class="cat" onclick="filterCat('Sports')">🏆 Sports</div>
<div class="cat" onclick="filterCat('Movies')">🎬 Movies</div>
<div class="cat" onclick="filterCat('News')">📰 News</div>
<div class="cat" onclick="filterCat('Kids')">🧸 Kids</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<div class="live">🔴 LIVE</div>
<video id="video" controls autoplay></video>
</div>

<div class="now">
<h3 id="title">No Channel Selected</h3>
<div class="buttons">
<button onclick="prev()">◀</button>
<button onclick="next()">▶</button>
</div>
</div>

<div class="channels" id="list"></div>

</div>

</div>

<script>

let channels=[];
let filtered=[];
let index=0;
let hls;

/* SAMPLE STREAMS */
const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* GENERATE USER CHANNELS */
function generate(){
const cats=["Sports","Movies","News","Kids"];

for(let i=1;i<=500;i++){
channels.push({
name:"BTECH "+cats[i%cats.length]+" "+i,
category:cats[i%cats.length],
url:streams[i%streams.length]
});
}

filtered=[...channels];
render();
}

/* RENDER */
function render(){
const box=document.getElementById("list");
box.innerHTML="";

filtered.forEach((c,i)=>{
const div=document.createElement("div");
div.className="channel";
div.innerHTML=`
<div>
<h4>${c.name}</h4>
<small>${c.category}</small>
</div>
`;

div.onclick=()=>play(i);
box.appendChild(div);
});
}

/* PLAY */
function play(i){
index=i;
const c=filtered[i];

document.getElementById("title").innerText=c.name;

if(hls) hls.destroy();

const video=document.getElementById("video");

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
}else{
video.src=c.url;
}

video.play();
}

/* NEXT/PREV */
function next(){
index=(index+1)%filtered.length;
play(index);
}

function prev(){
index=(index-1+filtered.length)%filtered.length;
play(index);
}

/* FILTER */
function filterCat(cat){
filtered = cat==="All"
? channels
: channels.filter(c=>c.category===cat);

render();
}

/* SEARCH */
function searchChannels(q){
filtered=channels.filter(c=>
c.name.toLowerCase().includes(q.toLowerCase())
);
render();
}

generate();

</script>

</body>
</html>
