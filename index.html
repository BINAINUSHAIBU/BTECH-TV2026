<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV USER DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

/* =========================
GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{
cursor:pointer;
border:none;
}

/* =========================
TOPBAR
========================= */

.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo h2{
font-size:22px;
color:var(--accent);
}

.user-box{
display:flex;
align-items:center;
gap:12px;
}

.user-avatar{
width:42px;
height:42px;
border-radius:50%;
background:var(--accent);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
color:black;
}

/* =========================
LAYOUT
========================= */

.container{
display:flex;
height:calc(100vh - 65px);
}

/* =========================
SIDEBAR
========================= */

.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar h3{
margin-bottom:15px;
color:var(--accent);
}

.menu-item{
padding:13px;
margin-bottom:10px;
background:var(--card);
border-radius:10px;
cursor:pointer;
transition:.3s;
font-size:14px;
}

.menu-item:hover,
.menu-item.active{
background:var(--accent);
color:black;
transform:translateX(4px);
}

/* =========================
MAIN
========================= */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* =========================
PLAYER
========================= */

.player{
height:340px;
background:black;
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

.live-badge{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:5;
}

/* =========================
OVERLAY
========================= */

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.88);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
}

.overlay h1{
font-size:60px;
margin-bottom:10px;
}

.overlay p{
color:var(--muted);
}

/* =========================
NOW PLAYING
========================= */

.now-playing{
background:var(--panel);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid rgba(255,255,255,.05);
border-bottom:1px solid rgba(255,255,255,.05);
}

.controls{
display:flex;
gap:10px;
}

.controls button{
padding:12px 16px;
background:var(--card);
border-radius:10px;
color:white;
transition:.3s;
}

.controls button:hover{
background:var(--hover);
}

/* =========================
CHANNELS
========================= */

.channels{
flex:1;
overflow-y:auto;
padding:12px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:14px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.3s;
border:1px solid transparent;
}

.channel:hover{
background:var(--hover);
transform:translateY(-2px);
border-color:var(--accent);
}

.channel.active{
border-color:var(--accent);
background:#00bfff22;
}

.channel-left{
display:flex;
gap:12px;
align-items:center;
overflow:hidden;
}

.channel-left img{
width:60px;
height:60px;
border-radius:10px;
object-fit:cover;
background:black;
}

.channel-info{
overflow:hidden;
}

.channel-info h4{
font-size:14px;
margin-bottom:4px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.channel-info small{
color:#cbd5e1;
}

.channel-right{
display:flex;
flex-direction:column;
gap:6px;
align-items:flex-end;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
}

.free{background:#16a34a;}
.paid{background:#dc2626;}
.live{background:#2563eb;}
.offline{background:#64748b;}
.locked{background:#f59e0b;}

/* =========================
RIGHT PANEL
========================= */

.right-panel{
width:320px;
background:var(--panel);
padding:15px;
overflow-y:auto;
border-left:1px solid rgba(255,255,255,.05);
}

.panel-card{
background:var(--card);
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

.panel-card h3{
margin-bottom:15px;
color:var(--accent);
}

.search-box{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
margin-top:10px;
}

.action-btn{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
background:var(--accent);
font-weight:bold;
color:black;
transition:.3s;
}

.action-btn:hover{
opacity:.85;
}

.stats-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
background:#0f172a;
padding:15px;
border-radius:10px;
text-align:center;
}

.stat h4{
font-size:12px;
margin-bottom:8px;
color:var(--muted);
}

.stat p{
font-size:20px;
font-weight:bold;
color:var(--accent);
}

/* =========================
SETTINGS
========================= */

.setting-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
margin-top:10px;
background:#0f172a;
border-radius:10px;
}

/* =========================
MOBILE
========================= */

@media(max-width:1000px){

.sidebar,
.right-panel{
display:none;
}

.channels{
grid-template-columns:1fr;
}

.player{
height:250px;
}

}

</style>
</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">
<h2>📺 BTECH-TV USER</h2>
</div>

<div class="user-box">

<div class="user-avatar">
U
</div>

<div>
<h4>Welcome User</h4>
<small>Premium Streaming Access</small>
</div>

</div>
</div>

<!-- CONTAINER -->

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<h3>📂 Categories</h3>

<div class="menu-item active" onclick="filterCategory('All',this)">
📺 All Channels
</div>

<div class="menu-item" onclick="filterCategory('Sports',this)">
🏆 Sports
</div>

<div class="menu-item" onclick="filterCategory('Movies',this)">
🎬 Movies
</div>

<div class="menu-item" onclick="filterCategory('News',this)">
📰 News
</div>

<div class="menu-item" onclick="filterCategory('Kids',this)">
🧸 Kids
</div>

<div class="menu-item" onclick="filterCategory('Music',this)">
🎵 Music
</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- PLAYER -->

<div class="player">

<div class="live-badge">
🔴 LIVE TV
</div>

<video id="videoPlayer" controls autoplay playsinline></video>

<div class="overlay" id="overlay">

<h1>🚀</h1>

<p>Loading BTECH-TV Engine...</p>

</div>

</div>

<!-- NOW PLAYING -->

<div class="now-playing">

<div>

<h3 id="channelName">
No Channel Selected
</h3>

<p id="channelCategory">
BTECH-TV Streaming
</p>

</div>

<div class="controls">

<button onclick="prevChannel()">
◀ Prev
</button>

<button onclick="nextChannel()">
Next ▶
</button>

</div>

</div>

<!-- CHANNEL LIST -->

<div class="channels" id="channelList"></div>

</div>

<!-- RIGHT PANEL -->

<div class="right-panel">

<div class="panel-card">

<h3>🔍 Search Channels</h3>

<input
class="search-box"
placeholder="Search 100,000 channels..."
oninput="searchChannels(this.value)"
>

<button class="action-btn" onclick="loadPlaylists()">
🚀 Reload Channels
</button>

</div>

<div class="panel-card">

<h3>📊 Statistics</h3>

<div class="stats-grid">

<div class="stat">
<h4>Total</h4>
<p id="total">0</p>
</div>

<div class="stat">
<h4>Free</h4>
<p id="free">0</p>
</div>

<div class="stat">
<h4>Premium</h4>
<p id="premium">0</p>
</div>

<div class="stat">
<h4>Locked</h4>
<p id="locked">0</p>
</div>

</div>

</div>

</div>

</div>

<script>

/* =========================
ENGINE
========================= */

const ENGINE={
maxChannels:100000,
renderLimit:250
};

/* =========================
GLOBAL STATE
========================= */

let channels=[];
let filteredChannels=[];
let currentPage=0;
let currentIndex=0;
let currentHls=null;
let autoPlay=true;

/* =========================
PLAYLISTS
========================= */

const playlists=[

"https://iptv-org.github.io/iptv/index.m3u",

"https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8",

"https://raw.githubusercontent.com/freecasthub/public-iptv/main/playlist.m3u"

];

/* =========================
BACKUP STREAMS
========================= */

const streams=[

"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",

"https://test-streams.mux.dev/test_001/stream.m3u8",

"https://test-streams.mux.dev/test_002/stream.m3u8"

];

/* =========================
LOAD PLAYLISTS
========================= */

async function loadPlaylists(){

channels=[];
showLoader("Loading IPTV Channels...");

for(const url of playlists){

try{

const res=await fetch(url);
const text=await res.text();

const parsed=parseM3U(text);

channels.push(...parsed);

}catch(err){

console.log("Playlist failed",url);

}

}

generateVirtualChannels();

filteredChannels=[...channels];

updateStats();

renderChannels();

hideLoader();

}

/* =========================
PARSE M3U
========================= */

function parseM3U(text){

const lines=text.split("\n");

const result=[];

let temp={};

for(let line of lines){

line=line.trim();

if(line.startsWith("#EXTINF")){

temp={

name:line.match(/,(.*)/)?.[1] || "Unknown",

logo:line.match(/tvg-logo="(.*?)"/)?.[1] || "https://via.placeholder.com/60",

category:line.match(/group-title="(.*?)"/)?.[1] || "Live"

};

}else if(line.startsWith("http")){

temp.url=line;

temp.type=Math.random()>0.7 ? "paid" : "free";
temp.status=Math.random()>0.9 ? "locked" : "live";
temp.viewers=Math.floor(Math.random()*1000000);

result.push(temp);

temp={};

}

}

return result;

}

/* =========================
GENERATE VIRTUAL CHANNELS
========================= */

function generateVirtualChannels(){

const categories=[
"Sports",
"Movies",
"News",
"Kids",
"Music",
"Africa",
"USA",
"UK"
];

const needed=ENGINE.maxChannels - channels.length;

for(let i=1;i<=needed;i++){

let cat=categories[i % categories.length];

channels.push({

name:"BTECH "+cat+" LIVE "+i,
category:cat,
logo:"https://via.placeholder.com/60",
type:i % 3===0 ? "paid" : "free",
status:i % 10===0 ? "locked" : "live",
viewers:Math.floor(Math.random()*1000000),
url:streams[i % streams.length]

});

}

}

/* =========================
UPDATE STATS
========================= */

function updateStats(){

document.getElementById("total").innerText=
channels.length.toLocaleString();

document.getElementById("free").innerText=
channels.filter(c=>c.type==="free").length.toLocaleString();

document.getElementById("premium").innerText=
channels.filter(c=>c.type==="paid").length.toLocaleString();

document.getElementById("locked").innerText=
channels.filter(c=>c.status==="locked").length.toLocaleString();

}

/* =========================
RENDER CHANNELS
========================= */

function renderChannels(reset=true){

const box=document.getElementById("channelList");

if(reset){
box.innerHTML="";
currentPage=0;
}

const start=currentPage*ENGINE.renderLimit;
const end=start+ENGINE.renderLimit;

filteredChannels.slice(start,end).forEach((c,index)=>{

const div=document.createElement("div");

div.className="channel";

div.innerHTML=`

<div class="channel-left">

<img src="${c.logo}" loading="lazy">

<div class="channel-info">

<h4>
${c.status==="live" ? "🔴" : "⚫"}
${c.name}
</h4>

<small>
${c.category} • 👥 ${c.viewers.toLocaleString()}
</small>

</div>

</div>

<div class="channel-right">

<span class="badge ${c.type==='free'?'free':'paid'}">
${c.type}
</span>

<span class="badge ${c.status==='locked'?'locked':'live'}">
${c.status}
</span>

</div>

`;

div.onclick=()=>playChannel(start+index,div);

box.appendChild(div);

});

}

/* =========================
PLAY CHANNEL
========================= */

function playChannel(index,el=null){

currentIndex=index;

const channel=filteredChannels[index];

document.getElementById("channelName").innerText=
channel.name;

document.getElementById("channelCategory").innerText=
channel.category;

const video=document.getElementById("videoPlayer");

if(currentHls){
currentHls.destroy();
}

if(Hls.isSupported()){

currentHls=new Hls({
enableWorker:true,
lowLatencyMode:true
});

currentHls.loadSource(channel.url);
currentHls.attachMedia(video);

currentHls.on(Hls.Events.MANIFEST_PARSED,()=>{

if(autoPlay){
video.play();
}

});

}else{

video.src=channel.url;

if(autoPlay){
video.play();
}

}

document.querySelectorAll(".channel").forEach(c=>{
c.classList.remove("active");
});

if(el){
el.classList.add("active");
}

}

/* =========================
NEXT / PREV
========================= */

function nextChannel(){

currentIndex++;

if(currentIndex>=filteredChannels.length){
currentIndex=0;
}

playChannel(currentIndex);

}

function prevChannel(){

currentIndex--;

if(currentIndex<0){
currentIndex=filteredChannels.length-1;
}

playChannel(currentIndex);

}

/* =========================
FILTER CATEGORY
========================= */

function filterCategory(cat,el){

document.querySelectorAll(".menu-item").forEach(btn=>{
btn.classList.remove("active");
});

if(el){
el.classList.add("active");
}

if(cat==="All"){

filteredChannels=[...channels];

}else{

filteredChannels=channels.filter(c=>

(c.category || "")
.toLowerCase()
.includes(cat.toLowerCase())

);

}

renderChannels();

}

/* =========================
SEARCH
========================= */

function searchChannels(q){

const value=q.toLowerCase();

filteredChannels=channels.filter(c=>

(c.name || "")
.toLowerCase()
.includes(value)

||

(c.category || "")
.toLowerCase()
.includes(value)

);

renderChannels();

}

/* =========================
LOADER
========================= */

function showLoader(text){

const overlay=document.getElementById("overlay");

overlay.style.display="flex";

overlay.innerHTML=`

<h1>🚀</h1>
<p>${text}</p>

`;

}

function hideLoader(){

document.getElementById("overlay").style.display="none";

}

/* =========================
INFINITE SCROLL
========================= */

document.getElementById("channelList")
.addEventListener("scroll",function(){

if(

this.scrollTop + this.clientHeight
>=
this.scrollHeight - 100

){

if(

(currentPage+1)*ENGINE.renderLimit
<
filteredChannels.length

){

currentPage++;

renderChannels(false);

}

}

});

/* =========================
START ENGINE
========================= */

loadPlaylists();

</script>

</body>
</html>
