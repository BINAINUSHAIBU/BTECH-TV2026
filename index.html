<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV USER DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{cursor:pointer;border:none;}

/* TOPBAR */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo h2{color:var(--accent);}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 65px);
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
}

.menu-item{
padding:13px;
margin-bottom:10px;
background:var(--card);
border-radius:10px;
transition:.3s;
cursor:pointer;
}

.menu-item:hover,
.menu-item.active{
background:var(--accent);
color:black;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* PLAYER */
.player{
height:340px;
background:black;
position:relative;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
}

.live-badge{
position:absolute;
top:15px;
left:15px;
background:red;
padding:6px 12px;
border-radius:20px;
}

/* NOW PLAYING */
.now-playing{
background:var(--panel);
padding:15px;
display:flex;
justify-content:space-between;
}

/* CHANNELS */
.channels{
flex:1;
overflow-y:auto;
padding:12px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:12px;
border-radius:12px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

.channel:hover{
background:var(--hover);
}

/* RIGHT PANEL */
.right-panel{
width:320px;
background:var(--panel);
padding:15px;
overflow-y:auto;
}

.panel-card{
background:var(--card);
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

.search-box{
width:100%;
padding:10px;
border-radius:10px;
background:#0f172a;
color:white;
}

.action-btn{
width:100%;
padding:10px;
margin-top:10px;
background:var(--accent);
border-radius:10px;
color:black;
font-weight:bold;
}

.setting-row{
display:flex;
justify-content:space-between;
padding:10px;
margin-top:8px;
background:#0f172a;
border-radius:10px;
}

/* SWITCH */
.switch{
position:relative;
width:45px;
height:22px;
display:inline-block;
}

.switch input{display:none;}

.slider{
position:absolute;
inset:0;
background:#334155;
border-radius:30px;
}

.slider:before{
content:"";
position:absolute;
height:16px;
width:16px;
left:3px;
top:3px;
background:white;
border-radius:50%;
transition:.3s;
}

input:checked + .slider{
background:var(--accent);
}

input:checked + .slider:before{
transform:translateX(22px);
}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<div class="logo"><h2>📺 BTECH-TV USER</h2></div>
<div>Premium Streaming</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h3>Categories</h3>

<div class="menu-item active" onclick="filterCategory('All')">All</div>
<div class="menu-item" onclick="filterCategory('Sports')">Sports</div>
<div class="menu-item" onclick="filterCategory('Movies')">Movies</div>
<div class="menu-item" onclick="filterCategory('News')">News</div>
<div class="menu-item" onclick="filterCategory('Music')">Music</div>

<div class="menu-item">🔥 Trending</div>
<div class="menu-item">💰 PPV</div>
<div class="menu-item">🔒 Locked</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<div class="live-badge">LIVE</div>
<video id="videoPlayer" controls autoplay></video>
</div>

<div class="now-playing">
<div>
<h3 id="channelName">No Channel Selected</h3>
<p id="channelCategory">Streaming</p>
</div>

<div>
<button onclick="prevChannel()">Prev</button>
<button onclick="nextChannel()">Next</button>
</div>
</div>

<div class="channels" id="channelList"></div>

</div>

<!-- RIGHT PANEL -->
<div class="right-panel">

<div class="panel-card">
<h3>Search</h3>
<input class="search-box" oninput="searchChannels(this.value)">
<button class="action-btn" onclick="loadChannels()">Reload</button>
</div>

<div class="panel-card">
<h3>Stats</h3>
<p>Total: <span id="total">0</span></p>
<p>Free: <span id="free">0</span></p>
<p>Premium: <span id="premium">0</span></p>
</div>

<div class="panel-card">
<h3>Settings</h3>

<div class="setting-row">
<span>AutoPlay</span>
<label class="switch">
<input type="checkbox" checked onchange="autoPlay=this.checked">
<span class="slider"></span>
</label>
</div>

<div class="setting-row">
<span>Theme</span>
<label class="switch">
<input type="checkbox" checked onchange="toggleTheme()">
<span class="slider"></span>
</label>
</div>

</div>

</div>

</div>

<script>

let channels=[];
let filtered=[];
let currentIndex=0;
let autoPlay=true;
let hls;

const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
];

const categories=["Sports","Movies","News","Music"];

const ENGINE={maxChannels:40000};

function loadChannels(){

channels=[];

for(let i=1;i<=ENGINE.maxChannels;i++){

let cat=categories[i%categories.length];

channels.push({
name:"BTECH "+cat+" "+i,
category:cat,
type:i%3===0?"paid":"free",
live:Math.random()>0.1,
url:streams[0]
});

}

filtered=[...channels];

updateStats();
render();
}

function updateStats(){

document.getElementById("total").innerText=channels.length;
document.getElementById("free").innerText=channels.filter(c=>c.type==="free").length;
document.getElementById("premium").innerText=channels.filter(c=>c.type==="paid").length;

}

function render(){

const box=document.getElementById("channelList");
box.innerHTML="";

filtered.slice(0,200).forEach((c,i)=>{

let div=document.createElement("div");
div.className="channel";
div.innerHTML=`
<div>${c.name}</div>
<div>${c.type}</div>
`;

div.onclick=()=>play(i);
box.appendChild(div);

});

}

function play(i){

currentIndex=i;
let c=filtered[i];

document.getElementById("channelName").innerText=c.name;
document.getElementById("channelCategory").innerText=c.category;

let video=document.getElementById("videoPlayer");

if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
}else{
video.src=c.url;
}

if(autoPlay)video.play();

}

function nextChannel(){
currentIndex++;
if(currentIndex>=filtered.length)currentIndex=0;
play(currentIndex);
}

function prevChannel(){
currentIndex--;
if(currentIndex<0)currentIndex=filtered.length-1;
play(currentIndex);
}

function filterCategory(cat){
filtered=cat==="All"?channels:channels.filter(c=>c.category===cat);
render();
}

function searchChannels(v){
filtered=channels.filter(c=>c.name.toLowerCase().includes(v.toLowerCase()));
render();
}

function toggleTheme(){
document.body.style.background=
document.body.style.background==="#fff"?"#0b0f1a":"#fff";
}

loadChannels();

</script>

</body>
</html>
