<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV PRO ULTRA MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b1020;
--panel:#111827;
--card:#1e293b;
--hover:#334155;
--accent:#00d4ff;
--text:#ffffff;
--muted:#94a3b8;
--success:#22c55e;
--danger:#ef4444;
--warning:#f59e0b;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
display:flex;
flex-direction:column;
height:100vh;
}

/* TOPBAR */
.topbar{
height:70px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid #1f2937;
}

.logo{
font-size:22px;
font-weight:bold;
color:var(--accent);
}

.menu{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.menu button{
background:var(--card);
color:white;
border:none;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.menu button:hover{
background:var(--hover);
}

/* MAIN */
.container{
flex:1;
display:flex;
overflow:hidden;
}

/* SIDEBAR */
.sidebar{
width:350px;
background:var(--panel);
display:flex;
flex-direction:column;
border-right:1px solid #1f2937;
}

.sidebar-header{
padding:15px;
border-bottom:1px solid #1f2937;
}

.sidebar-header h2{
color:var(--accent);
margin-bottom:8px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:10px;
}

.card{
background:var(--card);
padding:10px;
border-radius:10px;
text-align:center;
}

.card h3{
font-size:12px;
color:var(--muted);
margin-bottom:5px;
}

.card p{
font-size:16px;
font-weight:bold;
}

/* SEARCH */
.search-box{
padding:12px;
display:flex;
gap:10px;
border-bottom:1px solid #1f2937;
}

.search-box input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
outline:none;
}

/* CHANNEL LIST */
.channel-list{
flex:1;
overflow-y:auto;
padding:10px;
}

.channel{
display:flex;
align-items:center;
gap:12px;
background:var(--card);
padding:10px;
border-radius:12px;
margin-bottom:10px;
cursor:pointer;
transition:.3s;
}

.channel:hover{
background:var(--hover);
transform:scale(1.01);
}

.channel img{
width:55px;
height:55px;
border-radius:10px;
object-fit:cover;
background:black;
}

.channel-info{
flex:1;
overflow:hidden;
}

.channel-name{
font-size:14px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.channel-meta{
font-size:12px;
color:var(--muted);
margin-top:5px;
}

.badge{
font-size:10px;
padding:4px 7px;
border-radius:8px;
background:var(--success);
}

.locked{
background:var(--danger);
}

/* PLAYER AREA */
.main{
flex:1;
display:flex;
flex-direction:column;
}

.player{
flex:1;
position:relative;
background:black;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:5;
}

.overlay h1{
font-size:70px;
margin-bottom:15px;
}

.overlay p{
font-size:18px;
color:var(--muted);
}

/* CONTROLS */
.controls{
height:95px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-top:1px solid #1f2937;
}

.now-playing h3{
font-size:18px;
margin-bottom:5px;
}

.now-playing p{
font-size:13px;
color:var(--muted);
}

.control-buttons{
display:flex;
gap:10px;
}

.control-buttons button{
padding:12px 16px;
border:none;
border-radius:10px;
background:var(--card);
color:white;
cursor:pointer;
transition:.3s;
}

.control-buttons button:hover{
background:var(--hover);
}

/* EPG */
.epg{
height:180px;
overflow-y:auto;
background:#0f172a;
border-top:1px solid #1f2937;
padding:15px;
}

.epg h3{
margin-bottom:12px;
color:var(--accent);
}

.epg-item{
padding:10px;
background:var(--card);
border-radius:10px;
margin-bottom:8px;
}

/* SETTINGS */
.settings{
position:fixed;
right:20px;
top:80px;
width:300px;
background:var(--panel);
padding:20px;
border-radius:15px;
border:1px solid #1f2937;
display:none;
z-index:9999;
}

.settings h3{
margin-bottom:15px;
color:var(--accent);
}

.settings label{
display:block;
margin:12px 0 5px;
font-size:13px;
}

.settings select,
.settings input{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#1e293b;
color:white;
}

/* MOBILE */
@media(max-width:900px){
.sidebar{
position:absolute;
z-index:999;
height:100%;
width:100%;
}

.menu{
display:none;
}

.controls{
flex-direction:column;
height:auto;
padding:15px;
gap:10px;
}
}

</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
<div class="logo">📺 BTECH-TV PRO ULTRA MAX</div>

<div class="menu">
<button onclick="filterCategory('ALL')">ALL</button>
<button onclick="filterCategory('SPORTS')">SPORTS</button>
<button onclick="filterCategory('MOVIES')">MOVIES</button>
<button onclick="filterCategory('NEWS')">NEWS</button>
<button onclick="filterCategory('KIDS')">KIDS</button>
<button onclick="toggleTheme()">THEME</button>
<button onclick="toggleSettings()">SETTINGS</button>
</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="sidebar-header">
<h2>LIVE IPTV CHANNELS</h2>

<div class="stats-grid">
<div class="card">
<h3>Total</h3>
<p id="totalChannels">0</p>
</div>

<div class="card">
<h3>Sports</h3>
<p id="sportsCount">0</p>
</div>

<div class="card">
<h3>Premium</h3>
<p id="premiumCount">0</p>
</div>

<div class="card">
<h3>Status</h3>
<p style="color:lime">ONLINE</p>
</div>
</div>
</div>

<!-- SEARCH -->
<div class="search-box">
<input type="text" placeholder="Advanced Search IPTV Channels..." onkeyup="searchChannels(this.value)">
</div>

<!-- CHANNEL LIST -->
<div class="channel-list" id="channelList"></div>

</div>

<!-- MAIN -->
<div class="main">

<!-- PLAYER -->
<div class="player">
<video id="videoPlayer" controls autoplay playsinline></video>

<div class="overlay" id="overlay">
<h1>🚀</h1>
<p>Loading 100,000+ IPTV Channels...</p>
</div>
</div>

<!-- CONTROLS -->
<div class="controls">
<div class="now-playing">
<h3 id="channelName">No Channel Selected</h3>
<p id="channelGroup">BTECH IPTV ENGINE</p>
</div>

<div class="control-buttons">
<button onclick="prevChannel()">◀ PREV</button>
<button onclick="nextChannel()">NEXT ▶</button>
</div>
</div>

<!-- EPG -->
<div class="epg" id="epgGuide">
<h3>📺 LIVE TV GUIDE</h3>
<div class="epg-item">Loading EPG schedule...</div>
</div>

</div>
</div>

<!-- SETTINGS -->
<div class="settings" id="settingsBox">
<h3>System Settings</h3>

<label>Theme</label>
<select onchange="setTheme(this.value)">
<option value="dark">Dark</option>
<option value="blue">Blue</option>
<option value="green">Green</option>
<option value="purple">Purple</option>
</select>

<label>Auto Play</label>
<select onchange="setAutoPlay(this.value)">
<option value="true">ON</option>
<option value="false">OFF</option>
</select>

<label>M3U Playlist URL</label>
<input type="text" id="m3uInput" placeholder="https://example.com/playlist.m3u">

<label>Xtream API</label>
<input type="text" id="xtreamInput" placeholder="http://server:port/get.php?...">

<button style="margin-top:15px;width:100%;padding:12px;background:var(--accent);border:none;border-radius:10px;font-weight:bold;cursor:pointer" onclick="saveSettings()">
SAVE SETTINGS
</button>
</div>

<script>

// =========================================
// IPTV SOURCES
// =========================================
const playlists = [
'https://iptv-org.github.io/iptv/index.m3u',
'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8'
];

// =========================================
// GLOBAL STATE
// =========================================
let allChannels = [];
let filteredChannels = [];
let currentIndex = 0;
let hls = null;
let autoPlay = true;
let darkMode = true;

const categories = [
'SPORTS',
'MOVIES',
'NEWS',
'KIDS',
'MUSIC',
'DOCUMENTARY',
'VIP',
'AFRICA',
'USA',
'UK'
];

// =========================================
// GENERATE 100,000 CHANNELS
// =========================================
function generateChannels(){

for(let i=1;i<=100000;i++){

const category = categories[i % categories.length];

allChannels.push({
id:i,
name:`${category} LIVE ${i}`,
group:category,
logo:`https://logo.clearbit.com/youtube.com?${i}`,
type:Math.random()>0.5 ? 'FREE' : 'PREMIUM',
status:Math.random()>0.8 ? 'LOCKED' : 'UNLOCKED',
url:'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'
});
}

filteredChannels = allChannels;
updateStats();
renderChannels();
}

// =========================================
// FAST VIRTUAL RENDERING
// =========================================
function renderChannels(){

const list = document.getElementById('channelList');
list.innerHTML = '';

filteredChannels.slice(0,500).forEach((channel,index)=>{

const div = document.createElement('div');

div.className = 'channel';

div.innerHTML = `
<img src="${channel.logo}" loading="lazy">

<div class="channel-info">
<div class="channel-name">${channel.name}</div>
<div class="channel-meta">
${channel.group} | ${channel.type}
</div>
</div>

<div class="badge ${channel.status==='LOCKED'?'locked':''}">
${channel.status}
</div>
`;

// CLICK PLAY

div.onclick = ()=>{

if(channel.status==='LOCKED'){
alert('🔒 Premium Locked Channel');
return;
}

playChannel(index);
};

list.appendChild(div);
});
}

// =========================================
// PLAY CHANNEL
// =========================================
function playChannel(index){

currentIndex = index;

const channel = filteredChannels[index];

const video = document.getElementById('videoPlayer');

if(hls){
hls.destroy();
}

if(Hls.isSupported()){

hls = new Hls({
enableWorker:true,
lowLatencyMode:true
});

hls.loadSource(channel.url);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,()=>{
if(autoPlay){
video.play();
}
});

}else{
video.src = channel.url;
}

// NOW PLAYING

document.getElementById('channelName').innerText = channel.name;
document.getElementById('channelGroup').innerText = channel.group;

loadEPG(channel);
}

// =========================================
// EPG GUIDE
// =========================================
function loadEPG(channel){

const epg = document.getElementById('epgGuide');

epg.innerHTML = `
<h3>📺 ${channel.name} TV GUIDE</h3>

<div class="epg-item">
08:00 AM - Morning News
</div>

<div class="epg-item">
10:00 AM - Live Sports Event
</div>

<div class="epg-item">
01:00 PM - Movie Premiere
</div>

<div class="epg-item">
04:00 PM - Entertainment Show
</div>
`;
}

// =========================================
// SEARCH SYSTEM
// =========================================
function searchChannels(query){

filteredChannels = allChannels.filter(channel=>
channel.name.toLowerCase().includes(query.toLowerCase()) ||
channel.group.toLowerCase().includes(query.toLowerCase())
);

renderChannels();
}

// =========================================
// FILTER CATEGORY
// =========================================
function filterCategory(category){

if(category==='ALL'){
filteredChannels = allChannels;
}else{
filteredChannels = allChannels.filter(ch=>
ch.group===category
);
}

renderChannels();
}

// =========================================
// NEXT / PREV
// =========================================
function nextChannel(){
currentIndex++;
if(currentIndex>=filteredChannels.length){
currentIndex=0;
}
playChannel(currentIndex);
}

function prevChannel(){
currentIndex--;
if(currentIndex<0){
currentIndex=filteredChannels.length-1;
}
playChannel(currentIndex);
}

// =========================================
// STATS
// =========================================
function updateStats(){

const sports = allChannels.filter(c=>c.group==='SPORTS').length;
const premium = allChannels.filter(c=>c.type==='PREMIUM').length;


document.getElementById('totalChannels').innerText =
allChannels.length.toLocaleString();


document.getElementById('sportsCount').innerText =
sports.toLocaleString();


document.getElementById('premiumCount').innerText =
premium.toLocaleString();
}

// =========================================
// THEMES
// =========================================
function setTheme(theme){

if(theme==='blue'){
document.documentElement.style.setProperty('--bg','#061a33');
}

else if(theme==='green'){
document.documentElement.style.setProperty('--bg','#052e16');
}

else if(theme==='purple'){
document.documentElement.style.setProperty('--bg','#2e1065');
}

else{
document.documentElement.style.setProperty('--bg','#0b1020');
}

localStorage.setItem('theme',theme);
}

function toggleTheme(){

darkMode = !darkMode;

if(darkMode){
setTheme('dark');
}else{
setTheme('purple');
}
}

// =========================================
// SETTINGS
// =========================================
function toggleSettings(){

const box = document.getElementById('settingsBox');

box.style.display =
box.style.display==='block' ? 'none' : 'block';
}

function setAutoPlay(value){
autoPlay = value==='true';
localStorage.setItem('autoplay',value);
}

function saveSettings(){

localStorage.setItem(
'm3u',
document.getElementById('m3uInput').value
);

localStorage.setItem(
'xtream',
document.getElementById('xtreamInput').value
);

alert('✅ IPTV Settings Saved');
}

// =========================================
// LOAD SETTINGS
// =========================================
window.onload = ()=>{

const savedTheme = localStorage.getItem('theme');
const savedAuto = localStorage.getItem('autoplay');

if(savedTheme){
setTheme(savedTheme);
}

if(savedAuto){
autoPlay = savedAuto==='true';
}

// START ENGINE
setTimeout(()=>{
generateChannels();
document.getElementById('overlay').style.display='none';
},1500);
};

</script>
</body>
</html>
