<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH IPTV PRO ULTRA MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
   ROOT
========================= */

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1a2338;
--hover:#00d4ff;
--text:#ffffff;
--muted:#94a3b8;
--success:#22c55e;
--danger:#ef4444;
}

/* =========================
   GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
display:flex;
height:100vh;
overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
width:320px;
background:var(--panel);
display:flex;
flex-direction:column;
border-right:1px solid #1f2937;
overflow:hidden;
}

.sidebar h2{
padding:15px;
color:#00ffcc;
text-align:center;
border-bottom:1px solid #1f2937;
}

/* SEARCH */

.search-box{
padding:12px;
border-bottom:1px solid #1f2937;
}

.search-box input{
width:100%;
padding:12px;
background:#1e293b;
border:none;
outline:none;
border-radius:10px;
color:white;
}

/* CHANNEL LIST */

.channel-list{
flex:1;
overflow-y:auto;
padding:10px;
}

/* CHANNEL CARD */

.channel{
display:flex;
align-items:center;
gap:10px;
background:var(--card);
padding:10px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.channel:hover{
background:var(--hover);
color:black;
transform:scale(1.01);
}

.channel img{
width:50px;
height:50px;
border-radius:10px;
object-fit:cover;
background:black;
}

.channel-info{
flex:1;
overflow:hidden;
}

.channel-name{
font-size:14px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.channel-meta{
font-size:12px;
color:var(--muted);
margin-top:4px;
}

.live{
font-size:11px;
color:lime;
}

/* =========================
   MAIN
========================= */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* TOPBAR */

.topbar{
padding:15px;
background:#0f172a;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #1f2937;
flex-wrap:wrap;
gap:10px;
}

.logo{
font-size:20px;
font-weight:bold;
color:#00ffcc;
}

.menu{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.menu button{
background:#1e293b;
border:none;
padding:10px 14px;
border-radius:8px;
color:white;
cursor:pointer;
transition:.3s;
}

.menu button:hover{
background:var(--hover);
color:black;
}

/* STATS */

.stats{
display:flex;
gap:10px;
padding:10px;
background:#111827;
flex-wrap:wrap;
}

.card{
flex:1;
min-width:160px;
background:#1a2338;
padding:12px;
border-radius:10px;
text-align:center;
}

.card h3{
margin-bottom:6px;
font-size:15px;
}

/* PLAYER */

.player{
flex:1;
position:relative;
background:black;
display:flex;
justify-content:center;
align-items:center;
}

video{
width:95%;
height:90%;
border-radius:10px;
background:black;
object-fit:contain;
}

/* OVERLAY */

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.8);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10;
}

.overlay h1{
font-size:60px;
margin-bottom:10px;
}

.overlay p{
color:#94a3b8;
}

/* CONTROLS */

.controls{
padding:15px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid #1f2937;
flex-wrap:wrap;
gap:10px;
}

.now-playing h3{
font-size:18px;
margin-bottom:5px;
}

.now-playing p{
font-size:13px;
color:var(--muted);
}

.control-buttons{
display:flex;
gap:10px;
}

.control-buttons button{
padding:10px 14px;
background:#1e293b;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
transition:.3s;
}

.control-buttons button:hover{
background:var(--hover);
color:black;
}

/* SETTINGS */

.settings{
position:fixed;
right:20px;
top:80px;
width:280px;
background:#111827;
padding:20px;
border-radius:14px;
border:1px solid #1f2937;
display:none;
z-index:9999;
}

.settings h3{
margin-bottom:15px;
color:#00ffcc;
}

.settings label{
display:block;
margin-top:14px;
margin-bottom:5px;
font-size:13px;
}

.settings select{
width:100%;
padding:10px;
background:#1e293b;
border:none;
border-radius:8px;
color:white;
}

/* MOBILE */

@media(max-width:900px){

body{
flex-direction:column;
}

.sidebar{
width:100%;
height:45%;
}

.main{
height:55%;
}

.stats{
overflow-x:auto;
}

}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<h2>📺 BTECH IPTV PRO</h2>

<div class="search-box">
<input
type="text"
placeholder="Search channels..."
onkeyup="searchChannels(this.value)"
>
</div>

<div
class="channel-list"
id="channelList"
></div>

</div>

<!-- MAIN -->
<div class="main">

<!-- TOPBAR -->
<div class="topbar">

<div class="logo">
🚀 BTECH-TV ULTRA MAX
</div>

<div class="menu">

<button onclick="filterCategory('ALL')">
ALL
</button>

<button onclick="filterCategory('SPORTS')">
SPORTS
</button>

<button onclick="filterCategory('MOVIES')">
MOVIES
</button>

<button onclick="filterCategory('NEWS')">
NEWS
</button>

<button onclick="filterCategory('KIDS')">
KIDS
</button>

<button onclick="toggleSettings()">
SETTINGS
</button>

</div>

</div>

<!-- STATS -->
<div class="stats" id="stats">

<div class="card">
<h3>Total Channels</h3>
<p id="total">0</p>
</div>

<div class="card">
<h3>Sports</h3>
<p id="sportsCount">0</p>
</div>

<div class="card">
<h3>Premium</h3>
<p id="premiumCount">0</p>
</div>

<div class="card">
<h3>Status</h3>
<p style="color:lime">
ONLINE
</p>
</div>

</div>

<!-- PLAYER -->
<div class="player">

<video
id="player"
controls
autoplay
playsinline
></video>

<div
class="overlay"
id="overlay"
>

<h1>🚀</h1>

<p>
Loading IPTV Engine...
</p>

</div>

</div>

<!-- CONTROLS -->
<div class="controls">

<div class="now-playing">

<h3 id="channelName">
No Channel Selected
</h3>

<p id="channelGroup">
BTECH IPTV Streaming
</p>

</div>

<div class="control-buttons">

<button onclick="prevChannel()">
◀ PREV
</button>

<button onclick="nextChannel()">
NEXT ▶
</button>

</div>

</div>

</div>

<!-- SETTINGS -->
<div
class="settings"
id="settingsBox"
>

<h3>System Settings</h3>

<label>Theme</label>

<select onchange="setTheme(this.value)">

<option value="dark">
Dark
</option>

<option value="blue">
Blue
</option>

<option value="green">
Green
</option>

</select>

<label>Auto Play</label>

<select onchange="autoPlay=this.value==='true'">

<option value="true">
ON
</option>

<option value="false">
OFF
</option>

</select>

</div>

<script>

/* =========================
   IPTV SOURCES
========================= */

const playlists = [

"https://iptv-org.github.io/iptv/index.m3u",

"https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8",

"https://raw.githubusercontent.com/freecasthub/public-iptv/main/playlist.m3u"

];

/* =========================
   GLOBAL STATE
========================= */

let channels = [];
let filteredChannels = [];
let currentIndex = 0;
let autoPlay = true;
let hls = null;

/* =========================
   LOAD PLAYLISTS
========================= */

async function loadPlaylists(){

const seen = new Set();

for(const url of playlists){

try{

const res = await fetch(url);
const text = await res.text();

const parsed = parseM3U(text);

parsed.forEach(ch=>{

if(ch.url && !seen.has(ch.url)){

seen.add(ch.url);

channels.push({
...ch,
type: Math.random() > 0.5 ? "FREE" : "PREMIUM",
status: Math.random() > 0.8 ? "LOCKED" : "UNLOCKED"
});

}

});

}catch(err){

console.log("FAILED:", url);

}

}

/* VIRTUAL CHANNELS */

generateVirtualChannels();

filteredChannels = channels;

updateStats();

renderChannels();

document.getElementById("overlay").style.display = "none";

}

/* =========================
   VIRTUAL CHANNELS
========================= */

function generateVirtualChannels(){

const categories = [

"SPORTS",
"MOVIES",
"NEWS",
"KIDS",
"MUSIC",
"VIP",
"AFRICA",
"USA"

];

for(let i=1;i<=40000;i++){

const cat =
categories[i % categories.length];

channels.push({

id:i,

name:`${cat} CHANNEL ${i}`,

group:cat,

logo:"https://via.placeholder.com/60",

type:Math.random() > 0.5 ? "FREE" : "PREMIUM",

status:Math.random() > 0.8 ? "LOCKED" : "UNLOCKED",

url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"

});

}

}

/* =========================
   PARSE M3U
========================= */

function parseM3U(text){

const lines = text.split("\n");

const result = [];

let temp = {};

for(let line of lines){

line = line.trim();

if(line.startsWith("#EXTINF")){

temp = {

name:
line.match(/,(.*)/)?.[1] || "Unknown",

logo:
line.match(/tvg-logo="(.*?)"/)?.[1] || "",

group:
line.match(/group-title="(.*?)"/)?.[1] || "LIVE"

};

}

else if(line.startsWith("http")){

temp.url = line;

result.push(temp);

temp = {};

}

}

return result;

}

/* =========================
   RENDER CHANNELS
========================= */

function renderChannels(){

const list =
document.getElementById("channelList");

list.innerHTML = "";

filteredChannels
.slice(0,500)
.forEach((ch,index)=>{

const div =
document.createElement("div");

div.className = "channel";

div.innerHTML = `

<img
src="${ch.logo || 'https://via.placeholder.com/60'}"
loading="lazy"
>

<div class="channel-info">

<div class="channel-name">
${ch.name}
</div>

<div class="channel-meta">
${ch.group} | ${ch.type} | ${ch.status}
</div>

</div>

<div class="live">
● LIVE
</div>

`;

div.onclick = ()=>{

if(ch.status==="LOCKED"){

alert("🔒 Premium Channel Locked");
return;

}

playChannel(index);

};

list.appendChild(div);

});

}

/* =========================
   SEARCH
========================= */

function searchChannels(query){

filteredChannels =
channels.filter(ch =>

ch.name
.toLowerCase()
.includes(query.toLowerCase())

||

ch.group
.toLowerCase()
.includes(query.toLowerCase())

);

renderChannels();

}

/* =========================
   FILTER
========================= */

function filterCategory(category){

if(category==="ALL"){

filteredChannels = channels;

}else{

filteredChannels =
channels.filter(ch =>

ch.group
.toUpperCase()
.includes(category)

);

}

renderChannels();

}

/* =========================
   PLAY CHANNEL
========================= */

function playChannel(index){

currentIndex = index;

const ch =
filteredChannels[index];

document.getElementById("channelName").innerText =
ch.name;

document.getElementById("channelGroup").innerText =
ch.group;

const video =
document.getElementById("player");

if(hls){

hls.destroy();
hls = null;

}

if(Hls.isSupported()){

hls = new Hls({
enableWorker:true,
lowLatencyMode:true
});

hls.loadSource(ch.url);

hls.attachMedia(video);

hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{

if(autoPlay){

video.play();

}

}
);

}else{

video.src = ch.url;

if(autoPlay){

video.play();

}

}

}

/* =========================
   NEXT / PREV
========================= */

function nextChannel(){

currentIndex++;

if(currentIndex >= filteredChannels.length){

currentIndex = 0;

}

playChannel(currentIndex);

}

function prevChannel(){

currentIndex--;

if(currentIndex < 0){

currentIndex =
filteredChannels.length - 1;

}

playChannel(currentIndex);

}

/* =========================
   SETTINGS
========================= */

function toggleSettings(){

const box =
document.getElementById("settingsBox");

box.style.display =

box.style.display==="block"
? "none"
: "block";

}

/* =========================
   THEMES
========================= */

function setTheme(theme){

if(theme==="blue"){

document.documentElement
.style.setProperty("--bg","#061a33");

}

else if(theme==="green"){

document.documentElement
.style.setProperty("--bg","#052e16");

}

else{

document.documentElement
.style.setProperty("--bg","#0b0f1a");

}

}

/* =========================
   STATS
========================= */

function updateStats(){

const sports =
channels.filter(c =>
c.group === "SPORTS"
).length;

const premium =
channels.filter(c =>
c.type === "PREMIUM"
).length;

document.getElementById("total")
.innerText =
channels.length.toLocaleString();

document.getElementById("sportsCount")
.innerText =
sports.toLocaleString();

document.getElementById("premiumCount")
.innerText =
premium.toLocaleString();

}

/* =========================
   INIT
========================= */

loadPlaylists();

</script>

</body>
</html>
