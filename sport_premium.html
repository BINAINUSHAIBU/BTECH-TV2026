<head>

</div>

<div class="main">

listData.slice(0,500).forEach((ch, index)=>{ // limit UI render for performance

  <script>

// ===============================
// IPTV PRO 40,000 CHANNEL SYSTEM
// ===============================

let channels = [];

const categories = [
"SPORTS",
"MOVIES",
"NEWS",
"VIP",
"ENTERTAINMENT",
"KIDS",
"DOCUMENTARY",
"MUSIC"
];

// generate 40,000 ACTIVE channels
for (let i = 1; i <= 40000; i++) {

    let cat = categories[Math.floor(Math.random() * categories.length)];

    channels.push({
        id: i,
        name: `${cat} CHANNEL ${i}`,
        category: cat,

        type: Math.random() > 0.4 ? "FREE" : "PREMIUM",
        status: Math.random() > 0.7 ? "LOCKED" : "UNLOCKED",

        url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
    });
}

// ===============================
// INIT STATS
// ===============================
document.getElementById("total").innerText = channels.length;

// ===============================
// RENDER CHANNELS (FAST MODE)
// ===============================
function render(listData) {

    const list = document.getElementById("channelList");
    list.innerHTML = "";

    // render only first 400 for performance
    listData.slice(0, 400).forEach(ch => {

        let div = document.createElement("div");
        div.className = "channel";

        div.innerHTML = `
            <b>${ch.name}</b><br>
            <small>${ch.category} | ${ch.type} | ${ch.status}</small>
        `;

        div.onclick = () => {

            if (ch.status === "LOCKED") {
                alert("🔒 Channel Locked - Upgrade Required");
                return;
            }

            document.getElementById("player").src = ch.url;
        };

        list.appendChild(div);
    });
}

// ===============================
// SEARCH SYSTEM (FAST FILTER)
// ===============================
function filterChannels(val) {

    if (!val) return render(channels);

    let filtered = channels.filter(c =>
        c.name.toLowerCase().includes(val.toLowerCase()) ||
        c.category.toLowerCase().includes(val.toLowerCase())
    );

    render(filtered);
}

// ===============================
// AUTO STATS UPDATE
// ===============================
function updateStats() {

    const sports = channels.filter(c => c.category === "SPORTS").length;
    const premium = channels.filter(c => c.type === "PREMIUM").length;
    const locked = channels.filter(c => c.status === "LOCKED").length;

    document.querySelector(".stats").innerHTML = `
        <div class="card">
            <h3>Total Channels</h3>
            <p>${channels.length.toLocaleString()}</p>
        </div>

        <div class="card">
            <h3>Sports</h3>
            <p>${sports.toLocaleString()}</p>
        </div>

        <div class="card">
            <h3>Premium</h3>
            <p>${premium.toLocaleString()}</p>
        </div>

        <div class="card">
            <h3>Locked</h3>
            <p>${locked.toLocaleString()}</p>
        </div>
    `;
}

// ===============================
// INIT SYSTEM
// ===============================
render(channels);
updateStats();

</script>

</body>
</html>
